[build]
target = "x86_64-unknown-none"

[alias]
xtask = "run --manifest-path tools/rust/Cargo.toml --"

[target.x86_64-unknown-none]
linker = "rust-lld"
rustflags = ["-C", "link-arg=-Tkernel/linker.ld", "-C", "relocation-model=static", "-C", "code-model=kernel"]

[target.x86_64-unknown-uefi]
linker = "rust-lld"

[target.x86_64-pc-windows-msvc]
linker = "lld-link"

[target.x86_64-pc-windows-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=--target=x86_64-w64-windows-gnu", "-C", "link-arg=-fuse-ld=lld"]

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]
