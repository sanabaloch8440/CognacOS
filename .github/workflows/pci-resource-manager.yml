name: PCI PnP resource manager tests

on:
  push:
    branches: [main]
    paths:
      - 'drivers/pci/**'
      - 'shared/nt-abi/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/pci-resource-manager.yml'
  pull_request:
    paths:
      - 'drivers/pci/**'
      - 'shared/nt-abi/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/pci-resource-manager.yml'

permissions:
  contents: read

concurrency:
  group: cognacos-pci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pci-resource-manager:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust and LLVM linker
        run: |
          rustup show active-toolchain
          rustup target add x86_64-unknown-linux-gnu x86_64-unknown-none
          sudo apt-get update
          sudo apt-get install -y clang lld
          bash scripts/build.sh toolchain
      - name: Check shared Windows x64 ABI
        run: cargo check --manifest-path shared/nt-abi/Cargo.toml --target x86_64-unknown-linux-gnu --all-targets
      - name: Check PCI library and WDM driver binary
        run: |
          cargo check --manifest-path drivers/pci/Cargo.toml --target x86_64-unknown-linux-gnu --lib
          cargo check --manifest-path drivers/pci/Cargo.toml --target x86_64-unknown-none --bin pci
      - name: Test PCI resource allocation, bridge rebalance and IDE mapping
        run: cargo test --manifest-path drivers/pci/Cargo.toml --target x86_64-unknown-linux-gnu --lib
