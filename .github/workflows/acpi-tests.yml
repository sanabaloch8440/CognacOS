name: ACPI Rust unit tests

on:
  pull_request:
    paths:
      - 'drivers/acpi/**'
      - 'shared/nt-abi/**'
      - '.github/workflows/acpi-tests.yml'
  push:
    branches: [main]
    paths:
      - 'drivers/acpi/**'
      - 'shared/nt-abi/**'
      - '.github/workflows/acpi-tests.yml'

permissions:
  contents: read

jobs:
  acpi-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Compile all ACPI library tests
        run: cargo test --target x86_64-unknown-linux-gnu --manifest-path drivers/acpi/Cargo.toml --lib --no-run
      - name: Run firmware discovery regression suites
        shell: bash
        run: |
          for suite in rsdp_validation_regression_tests root_table_validation_regression_tests dsdt_resolution_tests firmware_table_policy_tests remaining_firmware_table_tests acpi_5_6_revision_tests numa_table_tests fadt_gas_tests aml::tests aml_runtime::tests aml_exec::tests aml_tables::tests; do
            cargo test --target x86_64-unknown-linux-gnu --manifest-path drivers/acpi/Cargo.toml --lib "$suite"
          done
