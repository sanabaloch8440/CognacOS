name: ACPI Rust unit tests

on:
  pull_request:
    paths:
      - 'drivers/acpi/**'
      - 'shared/nt-abi/**'
      - 'ntoskrnl/src/ke/**'
      - 'ntoskrnl/src/ntoskrnl.rs'
      - 'ntoskrnl/Cargo.toml'
      - 'Hal/exports.rs'
      - '.github/workflows/acpi-tests.yml'
  push:
    branches: [main]
    paths:
      - 'drivers/acpi/**'
      - 'shared/nt-abi/**'
      - 'ntoskrnl/src/ke/**'
      - 'ntoskrnl/src/ntoskrnl.rs'
      - 'ntoskrnl/Cargo.toml'
      - '.github/workflows/acpi-tests.yml'

permissions:
  contents: read

# Keep only the newest ACPI validation run; rapid implementation pushes should
# not consume runner minutes validating superseded commits.
concurrency:
  group: cognacos-acpi-unit-tests
  cancel-in-progress: true

jobs:
  acpi-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,x86_64-unknown-none
      - name: Compile all ACPI library tests
        run: cargo test --target x86_64-unknown-linux-gnu --manifest-path drivers/acpi/Cargo.toml --lib --no-run
      - name: Type-check the native ACPI WDM driver
        run: cargo check --target x86_64-unknown-none --manifest-path drivers/acpi/Cargo.toml --bin acpi
      - name: Run firmware discovery regression suites
        shell: bash
        run: |
          for suite in rsdp_validation_regression_tests root_table_validation_regression_tests dsdt_resolution_tests firmware_table_policy_tests remaining_firmware_table_tests acpi_5_6_revision_tests numa_table_tests fadt_gas_tests aml::tests aml_runtime::tests aml_exec::tests aml_objects::tests acpi_prt:: aml_tables::tests; do
            cargo test --target x86_64-unknown-linux-gnu --manifest-path drivers/acpi/Cargo.toml --lib "$suite"
          done
      - name: Type-check the kernel dispatcher implementation
        run: cargo check --target x86_64-unknown-none --manifest-path ntoskrnl/Cargo.toml
