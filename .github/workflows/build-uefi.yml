name: Build and boot-test RdotOS Rust UEFI kernel

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rust-os:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust targets
        run: |
          rustup update stable
          rustup target add x86_64-unknown-uefi x86_64-unknown-none
      - name: Run host-side ext filesystem parser tests
        run: |
          mkdir -p build
          rustc --edition=2021 --test kernel/src/extfs.rs -o build/extfs-tests
          build/extfs-tests
      - name: Build freestanding Rust kernel with project linker script
        env:
          RUSTFLAGS: -C relocation-model=static -C link-arg=-T${{ github.workspace }}/kernel/linker.ld
        run: cargo build --manifest-path kernel/Cargo.toml --target x86_64-unknown-none --release
      - name: Pin kernel digest into Rust bootloader trust anchor
        id: kernel-digest
        shell: bash
        run: |
          digest="$(sha256sum target/x86_64-unknown-none/release/rdotos-kernel | cut -d' ' -f1)"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
      - name: Build Rust UEFI bootloader with pinned kernel digest
        env:
          RDOTOS_KERNEL_SHA256: ${{ steps.kernel-digest.outputs.sha256 }}
        run: cargo build --manifest-path bootloader/Cargo.toml --target x86_64-unknown-uefi --release
      - name: Validate kernel ELF and entry point
        run: |
          file target/x86_64-unknown-none/release/rdotos-kernel
          readelf -h target/x86_64-unknown-none/release/rdotos-kernel
          readelf -l target/x86_64-unknown-none/release/rdotos-kernel
          readelf -h target/x86_64-unknown-none/release/rdotos-kernel | grep -qE 'Class:.*ELF64'
          readelf -h target/x86_64-unknown-none/release/rdotos-kernel | grep -qE 'Machine:.*X86-64'
          readelf -h target/x86_64-unknown-none/release/rdotos-kernel | grep -qE 'Type:.*EXEC'
      - name: Package a GPT EFI System Partition image
        run: |
          sudo apt-get update
          sudo apt-get install -y dosfstools mtools parted qemu-system-x86 ovmf
          mkdir -p build/EFI/BOOT build/kernel
          cp target/x86_64-unknown-uefi/release/rdotos-bootloader.efi build/EFI/BOOT/BOOTX64.EFI
          cp target/x86_64-unknown-none/release/rdotos-kernel build/EFI/BOOT/rdotos-kernel.elf
          cp target/x86_64-unknown-none/release/rdotos-kernel build/kernel/rdotos-kernel.elf
          truncate -s 256M build/rdotos-uefi.img
          parted -s build/rdotos-uefi.img mklabel gpt
          parted -s build/rdotos-uefi.img mkpart ESP fat32 1MiB 100%
          parted -s build/rdotos-uefi.img set 1 esp on
          mformat -i build/rdotos-uefi.img@@1048576 -F ::
          mmd -i build/rdotos-uefi.img@@1048576 ::/EFI
          mmd -i build/rdotos-uefi.img@@1048576 ::/EFI/BOOT
          mcopy -i build/rdotos-uefi.img@@1048576 build/EFI/BOOT/BOOTX64.EFI ::/EFI/BOOT/BOOTX64.EFI
          mcopy -i build/rdotos-uefi.img@@1048576 build/EFI/BOOT/rdotos-kernel.elf ::/EFI/BOOT/rdotos-kernel.elf
      - name: Boot smoke test under OVMF/QEMU
        shell: bash
        run: |
          set -euo pipefail
          # Select a matching CODE/VARS pair: mixing 2 MiB and 4 MiB
          # firmware images can make QEMU fail before the boot test starts.
          if [ -f /usr/share/OVMF/OVMF_CODE_4M.fd ] && [ -f /usr/share/OVMF/OVMF_VARS_4M.fd ]; then
            code=/usr/share/OVMF/OVMF_CODE_4M.fd
            vars_template=/usr/share/OVMF/OVMF_VARS_4M.fd
          elif [ -f /usr/share/OVMF/OVMF_CODE.fd ] && [ -f /usr/share/OVMF/OVMF_VARS.fd ]; then
            code=/usr/share/OVMF/OVMF_CODE.fd
            vars_template=/usr/share/OVMF/OVMF_VARS.fd
          else
            echo "No matching OVMF CODE/VARS firmware pair found" >&2
            find /usr/share/OVMF -maxdepth 1 -type f -print
            exit 1
          fi
          cp "$vars_template" build/OVMF_VARS.fd
          rm -f build/serial.log
          set +e
          timeout 30s qemu-system-x86_64 \
            -machine pc -m 512M -cpu qemu64 \
            -drive if=pflash,format=raw,readonly=on,file="$code" \
            -drive if=pflash,format=raw,file=build/OVMF_VARS.fd \
            -drive if=ide,format=raw,file=build/rdotos-uefi.img \
            -boot order=c -display none -monitor none \
            -serial file:build/serial.log -no-reboot -no-shutdown
          qemu_status=$?
          set -e
          # The kernel intentionally halts with interrupts disabled, so timeout
          # is expected after a successful handoff. Other QEMU failures are fatal.
          if [ "$qemu_status" -ne 124 ] && [ "$qemu_status" -ne 0 ]; then
            echo "QEMU exited unexpectedly with status $qemu_status" >&2
            cat build/serial.log || true
            exit "$qemu_status"
          fi
          if [ ! -f build/serial.log ]; then
            echo "QEMU did not create the serial log" >&2
            exit 1
          fi
          cat build/serial.log
          grep -F 'RdotOS Rust kernel entered.' build/serial.log
          grep -F 'Kernel-owned CR3 activated successfully.' build/serial.log
          grep -F 'Physical allocator initialized' build/serial.log
          grep -F 'HAL CPU-local registry, MMIO bounds, and x86-64 primitives initialized.' build/serial.log
          grep -F 'Firmware ACPI MADT validated; enabled APs discovered:' build/serial.log
          grep -F 'I/O manager cancellation, in-flight ownership, and asynchronous completion tests passed.' build/serial.log
          grep -F 'Security: CR0.WP enabled' build/serial.log
          grep -F 'Security: NX enabled; strict page policy follows' build/serial.log
          grep -F 'Security: 4 KiB page policy active; W^X enforced for kernel sections.' build/serial.log
          grep -F 'Security: kernel stack guard page unmapped.' build/serial.log
          grep -F 'Process address-space and checked user-copy self-test passed.' build/serial.log
          grep -F 'Security: ring-3 GDT/TSS RSP0 installed; IRETQ transition available.' build/serial.log
          grep -F 'PE32+ loader self-test passed; image base=0x0000200000000000 entry=0x0000200000001000 (RX section and RO/NX headers).' build/serial.log
          grep -F 'PE fixture: DLL export registration passed.' build/serial.log
          grep -F 'PE fixture: normal import binding passed.' build/serial.log
          grep -F 'PE fixture: delay import binding passed.' build/serial.log
          grep -F 'Windows API-set resolution and PE TLS/unwind registration passed.' build/serial.log
          grep -F 'PE TLS callbacks executed in ring 3; per-image TLS blocks initialized.' build/serial.log
          grep -F 'Ext filesystem parser self-test passed (read-only ext2/ext3/ext4 metadata; unsupported features rejected).' build/serial.log
          grep -F 'Ring-3 syscall dispatch, process exit, and PEB/TEB setup passed.' build/serial.log
      - name: Upload Rust artifacts and boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdotos-rust-uefi-kernel
          path: |
            build/EFI/BOOT/BOOTX64.EFI
            build/kernel/rdotos-kernel.elf
            build/rdotos-uefi.img
            build/serial.log
