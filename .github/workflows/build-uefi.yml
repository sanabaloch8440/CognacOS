name: Build and boot-test CognacOS Rust UEFI kernel

# TEMPORARILY PAUSED: expensive UEFI build/QEMU runs are manual-only while
# ACPI implementation work proceeds. Restore push/pull_request triggers before
# the final boot-verification campaign; workflow_dispatch remains available.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cognacos-build-uefi
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-rust-os:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_DEBUG: "2"
      CARGO_PROFILE_RELEASE_STRIP: "none"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python for CI-only validation helpers
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify CI helper runtime
        shell: bash
        run: |
          set -euo pipefail
          command -v python3
          python3 --version
          test -f scripts/ci/generate_ntdll_def.py
          test -f scripts/ci/validate_ntdll_pe.py
          echo "Python is permitted for CI orchestration and validation helpers; OS components and repository-native tooling remain Rust-based."

      - name: Install pinned Rust and LLVM LLD toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup show active-toolchain
          rustup target add x86_64-unknown-linux-gnu x86_64-unknown-uefi x86_64-unknown-none x86_64-pc-windows-msvc x86_64-pc-windows-gnu
          sudo apt-get update
          sudo apt-get install -y clang lld llvm mingw-w64-common mingw-w64-x86-64-dev gcc-mingw-w64-x86-64
          bash "$GITHUB_WORKSPACE/scripts/build.sh" toolchain
      - name: Run Rust-native repository contract validators
        shell: bash
        run: |
          set -euo pipefail
          cargo run --target x86_64-unknown-linux-gnu --manifest-path tools/rust/Cargo.toml -- validate-ntoskrnl-manifest
          cargo run --target x86_64-unknown-linux-gnu --manifest-path tools/rust/Cargo.toml -- check-ntdll-def
          cargo run --target x86_64-unknown-linux-gnu --manifest-path tools/rust/Cargo.toml -- check-csrsrv-def
      - name: Test .reg to native REGF conversion
        run: |
          set -euo pipefail
          cargo test --target x86_64-unknown-linux-gnu --manifest-path tools/rust/Cargo.toml -- reg_hive::tests
          cargo run --target x86_64-unknown-linux-gnu --manifest-path tools/rust/Cargo.toml -- reg-hive registry/drivers/CognacOS-Drivers.reg build/registry/SYSTEM registry/drivers/InputDrivers.reg registry/drivers/StorageDrivers.reg
          test -s build/registry/SYSTEM
          grep -a -q 'regf' build/registry/SYSTEM
      - name: Ensure third-party filesystem sources are absent
        shell: bash
        run: |
          set -euo pipefail
          if git ls-tree HEAD third_party/Ext3Fsd | grep -q .; then
            echo "Third-party filesystem driver gitlink must not be present in the source tree." >&2
            exit 1
          fi
          test ! -e third_party/Ext3Fsd
          test ! -e third_party/README.md
      - name: Enforce independent HAL and I/O DMA source boundaries
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'crate::(ntoskrnl|acpi::|pci::|kernel_vm|dma|boot_handoff)|cognacos_(acpi|pci)::' Hal --include='*.rs'; then
            echo "HAL implementation must not depend on NTOSKRNL internals, ACPI/PCI parser types, DMA policy, or boot handoff." >&2
            exit 1
          fi
          test ! -e Hal/vtd.rs
          test -s ntoskrnl/src/io/dma/vtd.rs
          test -s drivers/hal/src/kernel_services.rs
          grep -Fq 'pub mod hal;' drivers/hal/src/lib.rs
          grep -Fq 'pub(crate) use cognacos_hal_contract::hal as hal;' ntoskrnl/src/main.rs
          if grep -Fq '#[path = "../../Hal/mod.rs"]' ntoskrnl/src/main.rs; then
            echo "NTOSKRNL must consume the independently compiled HAL crate." >&2
            exit 1
          fi
      - name: Reject obsolete root APIC references
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInF 'crate::apic' ntoskrnl/src --include='*.rs' || grep -RInE 'use crate::\{[^}]*apic' ntoskrnl/src --include='*.rs'; then
            echo "APIC implementation must only be reached through HAL service contracts." >&2
            exit 1
          fi
      - name: Verify independent platform driver boundaries
        shell: bash
        run: |
          set -euo pipefail
          test ! -e ntoskrnl/src/acpi.rs
          test ! -e ntoskrnl/src/pci.rs
          grep -Fq '#![no_std]' drivers/acpi/src/lib.rs
          grep -Fq '#![no_std]' drivers/pci/src/lib.rs
          echo "HAL and independent driver source-boundary checks passed."
      - name: Test shared Windows x64 NT ABI layouts
        run: cargo test --manifest-path shared/nt-abi/Cargo.toml --target x86_64-unknown-linux-gnu --lib
      - name: Verify LLVM PE inspection tools
        run: |
          command -v llvm-readobj
          command -v llvm-objdump
          command -v ld.lld
      - name: Build and validate standalone HAL PE32+ image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/hal
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=lld-link \
          RUSTFLAGS="-C panic=abort -C link-arg=/DLL -C link-arg=/ENTRY:CognacHalInitialize -C link-arg=/NODEFAULTLIB -C link-arg=/SUBSYSTEM:NATIVE -C link-arg=/EXPORT:CognacHalInitialize -C link-arg=/BASE:0xFFFF8000C0000000" \
            cargo build --manifest-path drivers/hal/Cargo.toml --target x86_64-pc-windows-msvc --release --bin hal
          cp target/x86_64-pc-windows-msvc/release/hal.exe build/hal/hal.dll
          llvm-readobj --file-headers --coff-exports build/hal/hal.dll > build/hal/exports.txt
          grep -Fq "CognacHalInitialize" build/hal/exports.txt
          grep -Eq "Magic: 0x20B" build/hal/exports.txt
          if grep -Fq "DriverEntry" build/hal/exports.txt; then
            echo "The HAL image must not masquerade as an ordinary WDM DriverEntry driver." >&2
            exit 1
          fi
          echo "Built standalone HAL PE32+ image with private CognacHalInitialize bootstrap export."
      - name: Test CognacOS bcrypt CNG implementation
        run: cargo test --manifest-path dlls/bcrypt/Cargo.toml --target x86_64-unknown-linux-gnu --lib
      - name: Check native Windows x64 bcrypt.dll
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/bcrypt
          def_file="$GITHUB_WORKSPACE/dlls/bcrypt/exports/bcrypt-x64.def"
          test -s "$def_file"
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=clang RUSTFLAGS="-C panic=abort -C link-arg=--target=x86_64-w64-windows-gnu -C link-arg=-fuse-ld=lld -C link-arg=$def_file" cargo build --manifest-path dlls/bcrypt/Cargo.toml --target x86_64-pc-windows-gnu --release --lib
          dll_path="target/x86_64-pc-windows-gnu/release/bcrypt.dll"
          if [[ ! -s "$dll_path" ]]; then
            echo "Expected bcrypt cdylib was not produced at $dll_path."
            find target/x86_64-pc-windows-gnu/release -maxdepth 2 -type f -printf '%p\n' | sort
            exit 1
          fi
          cp "$dll_path" build/bcrypt/bcrypt.dll
          llvm-readobj --file-headers --coff-exports build/bcrypt/bcrypt.dll | tee build/bcrypt/exports.txt
          grep -Fq "BCryptOpenAlgorithmProvider" build/bcrypt/exports.txt
          grep -Fq "BCryptGenRandom" build/bcrypt/exports.txt
          grep -Fq "BCryptDeriveKeyPBKDF2" build/bcrypt/exports.txt
          export_count="$(grep -cE '^[[:space:]]*Name: BCrypt' build/bcrypt/exports.txt || true)"
          echo "Detected named BCrypt API exports: $export_count"
          test "$export_count" -eq 60
          grep -Eq "Magic: 0x20B" build/bcrypt/exports.txt
          echo "Built bcrypt.dll; verified PE32+ and all 60 named exports."
      - name: Check independent HAL implementation and contracts
        run: |
          set -euo pipefail
          cargo check --manifest-path drivers/hal/Cargo.toml --target x86_64-unknown-linux-gnu --lib
          cargo check --manifest-path drivers/hal/Cargo.toml --target x86_64-unknown-none --lib
          cargo check --manifest-path drivers/hal/Cargo.toml --target x86_64-unknown-none --bin hal
      - name: Test HAL implementation, ABI and service contracts
        run: cargo test --manifest-path drivers/hal/Cargo.toml --target x86_64-unknown-linux-gnu --lib
      - name: Check ACPI driver library
        run: cargo check --manifest-path drivers/acpi/Cargo.toml --lib
      - name: Test ACPI driver unit and regression suite
        run: cargo test --manifest-path drivers/acpi/Cargo.toml --target x86_64-unknown-linux-gnu --lib
      - name: Check PCI driver library
        run: cargo check --manifest-path drivers/pci/Cargo.toml --lib
      - name: Test PCI ECAM and xHCI resource decoding
        run: cargo test --manifest-path drivers/pci/Cargo.toml --target x86_64-unknown-linux-gnu --lib
      - name: Check processor driver library
        run: cargo check --manifest-path drivers/processor/Cargo.toml --lib
      - name: Check ext4 driver library
        run: cargo check --manifest-path drivers/ext4/Cargo.toml --lib
      - name: Check FAT32 driver library
        run: cargo check --manifest-path drivers/fat32/Cargo.toml --lib
      - name: Test FAT32 partition bounds, geometry, and writable file round-trip
        run: cargo test --manifest-path drivers/fat32/Cargo.toml --features write-support --target x86_64-unknown-linux-gnu --lib
      - name: Check freestanding kernel with FAT32 driver dependency
        run: cargo check --manifest-path ntoskrnl/Cargo.toml --target x86_64-unknown-none
      - name: Check storage stack library
        run: cargo check --manifest-path drivers/storage/Cargo.toml --lib
      - name: Test storage protocol and disk-class primitives
        run: cargo test --manifest-path drivers/storage/Cargo.toml --target x86_64-unknown-linux-gnu --lib
      - name: Check keyboard class driver
        run: cargo check --manifest-path drivers/kbdclass/Cargo.toml --lib
      - name: Test keyboard class queue and exclusive ownership
        run: cargo test --manifest-path drivers/kbdclass/Cargo.toml --target x86_64-unknown-linux-gnu --lib
      - name: Check US keyboard layout translation core
        run: cargo check --manifest-path drivers/kbdus/Cargo.toml --lib
      - name: Test US keyboard layout scan-code, modifiers, and text translation
        run: cargo test --manifest-path drivers/kbdus/Cargo.toml --target x86_64-unknown-linux-gnu --lib
      - name: Build and validate native Windows x64 US keyboard layout DLL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/kbdus
          sysroot="$(rustc --print sysroot)"
          mkdir -p "$RUNNER_TEMP/kbdus-linker"
          ln -sf "$sysroot/lib/rustlib/x86_64-unknown-linux-gnu/bin/rust-lld" "$RUNNER_TEMP/kbdus-linker/lld-link"
          export PATH="$RUNNER_TEMP/kbdus-linker:$PATH"
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=lld-link \
          RUSTFLAGS="-C panic=abort -C debuginfo=2 -C link-arg=/DLL -C link-arg=/ENTRY:DllMain -C link-arg=/NODEFAULTLIB -C link-arg=/EXPORT:KbdLayerDescriptor" \
            cargo build --manifest-path drivers/kbdus/Cargo.toml --target x86_64-pc-windows-msvc --release --lib
          cp target/x86_64-pc-windows-msvc/release/kbdus.dll build/kbdus/kbdus.dll
          llvm-readobj --file-headers --coff-exports build/kbdus/kbdus.dll > build/kbdus/exports.txt
          grep -Fq "KbdLayerDescriptor" build/kbdus/exports.txt
          grep -Eq "Magic: 0x20B" build/kbdus/exports.txt
          echo "Built PE32+ kbdus.dll and verified KbdLayerDescriptor export."
      - name: Check HID class driver
        run: cargo check --manifest-path drivers/hidclass/Cargo.toml --lib
      - name: Test HID top-level collection parser
        run: cargo test --manifest-path drivers/hidclass/Cargo.toml --target x86_64-unknown-linux-gnu --lib
      - name: Check HID keyboard mapper
        run: cargo check --manifest-path drivers/kbdhid/Cargo.toml --lib
      - name: Test HID keyboard report transitions
        run: cargo test --manifest-path drivers/kbdhid/Cargo.toml --target x86_64-unknown-linux-gnu --lib
      - name: Check Windows x64 beep driver core
        run: cargo check --manifest-path drivers/beep/Cargo.toml --lib
      - name: Test Windows BEEP IOCTL, parameter validation and PIT speaker programming
        run: cargo test --manifest-path drivers/beep/Cargo.toml --target x86_64-unknown-linux-gnu --lib
      - name: Check PS/2 i8042 port driver
        run: cargo check --manifest-path drivers/i8042prt/Cargo.toml --lib
      - name: Test PS/2 scan-code and bounded polling
        run: cargo test --manifest-path drivers/i8042prt/Cargo.toml --target x86_64-unknown-linux-gnu --lib
      - name: Check USB xHCI controller core
        run: cargo check --manifest-path drivers/usbxhci/Cargo.toml --lib
      - name: Test USB xHCI capability, rings, DMA and controller startup
        run: cargo test --manifest-path drivers/usbxhci/Cargo.toml --target x86_64-unknown-linux-gnu --lib
      - name: Check separate USB 3 hub policy library
        run: cargo check --manifest-path drivers/usbhub3/Cargo.toml --lib
      - name: Test USB hub descriptors, port lifecycle and stale-completion generation
        run: cargo test --manifest-path drivers/usbhub3/Cargo.toml --target x86_64-unknown-linux-gnu --lib
      - name: Check UCX 1.2.0 host-controller extension core
        run: cargo check --manifest-path drivers/ucx01020/Cargo.toml --lib
      - name: Test UCX object, request, cancellation and generation lifetimes
        run: cargo test --manifest-path drivers/ucx01020/Cargo.toml --target x86_64-unknown-linux-gnu --lib
      - name: Test JBD2 journal superblock validation and feature gating
        run: cargo test --manifest-path drivers/ext4/Cargo.toml --target x86_64-unknown-linux-gnu --lib jbd2::tests
      - name: Test ext4 bitmap, directory, inode, and inline extent mutations
        run: cargo test --manifest-path drivers/ext4/Cargo.toml --target x86_64-unknown-linux-gnu --lib ops::tests
      - name: Test ext4 parser and extent mapping
        run: cargo test --manifest-path drivers/ext4/Cargo.toml --target x86_64-unknown-linux-gnu --lib parser_mapping_and_crc_smoke_tests_pass
      - name: Test ext4 metadata checksum validation
        run: cargo test --manifest-path drivers/ext4/Cargo.toml --target x86_64-unknown-linux-gnu --lib metadata_csum_superblock_is_checked_and_corruption_rejected
      - name: Test ext4 group descriptor and inode metadata checksums
        run: cargo test --manifest-path drivers/ext4/Cargo.toml --target x86_64-unknown-linux-gnu --lib ext4_metadata_checksum_tests
      - name: Test ext4 superblock bitmap extent and directory checksums
        run: cargo test --manifest-path drivers/ext4/Cargo.toml --target x86_64-unknown-linux-gnu --lib ext4_metadata_blocks_checksum_tests
      - name: Test ext4 HTree indexed root and interior-node lookup
        run: cargo test --manifest-path drivers/ext4/Cargo.toml --target x86_64-unknown-linux-gnu --lib indexed_root_
      - name: Test ext4 directory hashes against Linux reference vectors
        run: cargo test --manifest-path drivers/ext4/Cargo.toml --target x86_64-unknown-linux-gnu --lib linux_reference_tests
      - name: Test ext4 SipHash implementation and hash-version gates
        run: cargo test --manifest-path drivers/ext4/Cargo.toml --target x86_64-unknown-linux-gnu --lib hash::tests
      - name: Test ext4 HTree collision lookup and indexed readdir
        run: cargo test --manifest-path drivers/ext4/Cargo.toml --target x86_64-unknown-linux-gnu --lib collision_lookup_crosses
      - name: Test ext4 HTree leaf and index node splitting
        run: cargo test --manifest-path drivers/ext4/Cargo.toml --target x86_64-unknown-linux-gnu --lib htree_mut::tests
      - name: Test ext4 HTree malformed indexes and directory leaf checksums
        run: cargo test --manifest-path drivers/ext4/Cargo.toml --target x86_64-unknown-linux-gnu --lib rejects_bad_counts_depth_cycles_and_leaf_checksums
      - name: Test GPT partition create, extend, and delete
        run: cargo test --manifest-path drivers/ext4/Cargo.toml --target x86_64-unknown-linux-gnu --lib gpt_partition_create_extend_delete_updates_both_crc_protected_copies
      - name: Test GPT partition overlap and bounds rejection
        run: cargo test --manifest-path drivers/ext4/Cargo.toml --target x86_64-unknown-linux-gnu --lib gpt_partition_mutations_reject_overlap_and_out_of_usable_bounds
      - name: Test MBR primary partition create, extend, and delete
        run: cargo test --manifest-path drivers/ext4/Cargo.toml --target x86_64-unknown-linux-gnu --lib mbr_primary_create_extend_delete_and_overlap_checks
      - name: Test MBR mutation rejects protective and extended layouts
        run: cargo test --manifest-path drivers/ext4/Cargo.toml --target x86_64-unknown-linux-gnu --lib mbr_mutation_rejects_protective_and_extended_layouts
      - name: Test ext4 writes reject requests beyond EOF
        run: cargo test --manifest-path drivers/ext4/Cargo.toml --target x86_64-unknown-linux-gnu --lib writes_past_inode_eof_are_rejected_before_device_io
      - name: Test ext4 in-place writes preserve untouched bytes
        run: cargo test --manifest-path drivers/ext4/Cargo.toml --target x86_64-unknown-linux-gnu --lib writes_existing_extent_data_with_read_modify_write_and_flush
      - name: Build and validate Rust NTDLL crate
        shell: bash
        run: |
          set -euo pipefail
          cargo run --quiet --target x86_64-unknown-linux-gnu --manifest-path tools/rust/Cargo.toml -- check-ntdll-def
          cargo check --manifest-path ntdll/Cargo.toml --all-targets --target x86_64-unknown-linux-gnu
          cargo build --manifest-path ntdll/Cargo.toml --lib --target x86_64-unknown-linux-gnu
      - name: Verify vendored Windows x64 export tables offline
        run: cargo run --quiet --target x86_64-unknown-linux-gnu --manifest-path tools/rust/Cargo.toml -- verify-windows-exports
      - name: Check Rust kernel32, kernelbase, and shell32 crates
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path dlls/kernel32/Cargo.toml --all-targets --target x86_64-unknown-linux-gnu
          cargo check --manifest-path dlls/kernelbase/Cargo.toml --all-targets --target x86_64-unknown-linux-gnu
          cargo check --manifest-path dlls/shell32/Cargo.toml --all-targets --target x86_64-unknown-linux-gnu
          cargo check --manifest-path dlls/msvcrt/Cargo.toml --all-targets --target x86_64-unknown-linux-gnu
          cargo check --manifest-path dlls/syssetup/Cargo.toml --all-targets --target x86_64-unknown-linux-gnu
          cargo check --manifest-path shared/net-security/Cargo.toml --all-targets --target x86_64-unknown-linux-gnu
          cargo check --manifest-path programs/rundll32/Cargo.toml --all-targets --target x86_64-unknown-linux-gnu
          cargo test --manifest-path programs/rundll32/Cargo.toml --target x86_64-unknown-linux-gnu --bin rundll32
      - name: Enforce one NTDLL syscall transition path
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'int[[:space:]]+0x82' ntdll/src; then
            echo "NTDLL must not use the legacy DPL3 interrupt-gate syscall path." >&2
            exit 1
          fi
          if grep -RInF 'install_user_gate(0x82' ntoskrnl/src; then
            echo "The kernel must not install the obsolete NT syscall interrupt gate." >&2
            exit 1
          fi
          grep -Eq '^NtCreateKey[[:space:]]+0x145[[:space:]]+7$' ntdll/syscalls/x86_64.syscalls
          grep -Fq 'ntdll_syscall_stubs.S' ntdll/src/native/syscall_stubs.rs
          grep -Fq 'syscall' ntdll/build.rs
          test ! -e ntdll/src/native/syscall_x86_64.rs
          if grep -RInF 'syscall_x86_64' ntdll/src; then
            echo "NTDLL must not retain references to the alternate syscall path." >&2
            exit 1
          fi
          echo "NTDLL stubs are generated from the canonical syscall manifest."
      - name: Build Rust NTDLL as a native PE32+ DLL
        shell: bash
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: lld-link
          RUSTFLAGS: "-C debuginfo=2 -C force-frame-pointers=yes -C link-arg=/DEBUG:FULL -C link-arg=/PDB:${{ github.workspace }}/build/ntdll/cognac_ntdll.pdb -C link-arg=/DEF:${{ github.workspace }}/build/ntdll/ntdll-rust.def -C link-arg=/ENTRY:DllMain -C link-arg=/NODEFAULTLIB -C link-arg=/LIBPATH:${{ github.workspace }}/ntdll"
        run: |
          set -euo pipefail
          mkdir -p build/ntdll
          python3 scripts/ci/generate_ntdll_def.py
          sysroot="$(rustc --print sysroot)"
          mkdir -p "$RUNNER_TEMP/ntdll-linker"
          ln -sf "$sysroot/lib/rustlib/x86_64-unknown-linux-gnu/bin/rust-lld" "$RUNNER_TEMP/ntdll-linker/lld-link"
          test -x "$RUNNER_TEMP/ntdll-linker/lld-link"
          export PATH="$RUNNER_TEMP/ntdll-linker:$PATH"
          cat > "$RUNNER_TEMP/ntdll-empty.rs" <<'RS'
          #![no_std]
          #[no_mangle]
          pub extern "C" fn cognac_ntdll_empty_archive_member() {}
          RS
          rustc --edition=2021 --target x86_64-pc-windows-msvc --crate-type lib --emit=obj -o "$RUNNER_TEMP/ntdll-empty.obj" "$RUNNER_TEMP/ntdll-empty.rs"
          llvm-ar rcs ntdll/ntdll.lib "$RUNNER_TEMP/ntdll-empty.obj"
          trap 'rm -f ntdll/ntdll.lib "$RUNNER_TEMP/ntdll-empty.obj" "$RUNNER_TEMP/ntdll-empty.rs"' EXIT
          cargo build --manifest-path ntdll/Cargo.toml --lib --target x86_64-pc-windows-msvc --release
          dll=target/x86_64-pc-windows-msvc/release/cognac_ntdll.dll
          test -s "$dll"
          file "$dll" | grep -q 'PE32+.*DLL'
          python3 scripts/ci/validate_ntdll_pe.py "$dll"
      - name: Build Rust kernel32.dll, kernelbase.dll, and shell32.dll as native PE32+ DLLs
        shell: bash
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: lld-link
        run: |
          set -euo pipefail
          sysroot="$(rustc --print sysroot)"
          mkdir -p "$RUNNER_TEMP/cognacos-dll-linker" build/dlls
          ln -sf "$sysroot/lib/rustlib/x86_64-unknown-linux-gnu/bin/rust-lld" "$RUNNER_TEMP/cognacos-dll-linker/lld-link"
          export PATH="$RUNNER_TEMP/cognacos-dll-linker:$PATH"
          cat > "$RUNNER_TEMP/cognacos-dll-empty.rs" <<'RS'
          #![no_std]
          #[no_mangle]
          pub extern "C" fn cognacos_empty_import_library_member() {}
          RS
          rustc --edition=2021 --target x86_64-pc-windows-msvc --crate-type lib --emit=obj -o "$RUNNER_TEMP/cognacos-dll-empty.obj" "$RUNNER_TEMP/cognacos-dll-empty.rs"
          mkdir -p dlls/kernel32 dlls/kernelbase dlls/shell32 dlls/msvcrt
          llvm-ar rcs dlls/kernel32/kernel32.lib "$RUNNER_TEMP/cognacos-dll-empty.obj"
          llvm-ar rcs dlls/kernelbase/kernel32.lib "$RUNNER_TEMP/cognacos-dll-empty.obj"
          llvm-ar rcs dlls/kernelbase/ntdll.lib "$RUNNER_TEMP/cognacos-dll-empty.obj"
          llvm-ar rcs dlls/shell32/kernel32.lib "$RUNNER_TEMP/cognacos-dll-empty.obj"
          llvm-ar rcs dlls/kernel32/ntdll.lib "$RUNNER_TEMP/cognacos-dll-empty.obj"
          llvm-ar rcs dlls/shell32/ntdll.lib "$RUNNER_TEMP/cognacos-dll-empty.obj"
          llvm-ar rcs dlls/msvcrt/kernel32.lib "$RUNNER_TEMP/cognacos-dll-empty.obj"
          llvm-ar rcs dlls/msvcrt/ntdll.lib "$RUNNER_TEMP/cognacos-dll-empty.obj"
          RUSTFLAGS="-C link-arg=/NODEFAULTLIB -C link-arg=/ENTRY:DllMain -C link-arg=/DEF:$GITHUB_WORKSPACE/dlls/kernel32/exports/kernel32-x64.def -C link-arg=/LIBPATH:$GITHUB_WORKSPACE/dlls/kernel32" cargo build --manifest-path dlls/kernel32/Cargo.toml --lib --target x86_64-pc-windows-msvc --release
          RUSTFLAGS="-C link-arg=/NODEFAULTLIB -C link-arg=/ENTRY:DllMain -C link-arg=/DEF:$GITHUB_WORKSPACE/dlls/kernelbase/exports/kernelbase-x64.def -C link-arg=/LIBPATH:$GITHUB_WORKSPACE/dlls/kernelbase" cargo build --manifest-path dlls/kernelbase/Cargo.toml --lib --target x86_64-pc-windows-msvc --release
