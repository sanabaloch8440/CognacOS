name: Build RdotOS Rust UEFI and kernel artifacts

on:
  push:
    branches: [main, rust-kernel-bootstrap]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rust-os:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust targets
        run: |
          rustup update stable
          rustup target add x86_64-unknown-uefi x86_64-unknown-none
      - name: Build Rust UEFI bootloader
        run: cargo build --manifest-path bootloader/Cargo.toml --target x86_64-unknown-uefi --release
      - name: Build freestanding Rust kernel
        run: cargo build --manifest-path kernel/Cargo.toml --target x86_64-unknown-none --release
      - name: Package EFI fallback image
        run: |
          sudo apt-get update
          sudo apt-get install -y dosfstools mtools
          mkdir -p build/EFI/BOOT build/kernel
          cp target/x86_64-unknown-uefi/release/rdotos-bootloader.efi build/EFI/BOOT/BOOTX64.EFI
          cp target/x86_64-unknown-none/release/rdotos-kernel build/kernel/rdotos-kernel.elf
          truncate -s 64M build/rdotos-uefi.img
          mkfs.vfat build/rdotos-uefi.img
          mmd -i build/rdotos-uefi.img ::/EFI
          mmd -i build/rdotos-uefi.img ::/EFI/BOOT
          mcopy -i build/rdotos-uefi.img build/EFI/BOOT/BOOTX64.EFI ::/EFI/BOOT/BOOTX64.EFI
          mcopy -i build/rdotos-uefi.img build/kernel/rdotos-kernel.elf ::/EFI/BOOT/rdotos-kernel.elf
      - name: Upload Rust artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rdotos-rust-uefi-kernel
          path: |
            build/EFI/BOOT/BOOTX64.EFI
            build/kernel/rdotos-kernel.elf
            build/rdotos-uefi.img
