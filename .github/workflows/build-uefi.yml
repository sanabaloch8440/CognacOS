            sbverify --cert build/cognacos-secure-boot.crt build/cognacos-bootloader.signed.efi
            rm -f build/cognacos-secure-boot.key
            echo "UEFI bootloader signed with configured Secure Boot certificate."
          else
            echo "WARNING: no firmware Secure Boot signing certificate configured; bootloader is unsigned and Secure Boot firmware will reject it."
          fi
      - name: Validate source ELF and PE32+ kernel image
        run: |
          file target/x86_64-unknown-none/release/cognacos-kernel build/cognacos-kernel.exe
          readelf -h target/x86_64-unknown-none/release/cognacos-kernel | grep -qE 'Class:.*ELF64'
          readelf -h target/x86_64-unknown-none/release/cognacos-kernel | grep -qE 'Machine:.*X86-64'
          readelf -h target/x86_64-unknown-none/release/cognacos-kernel | grep -qE 'Type:.*EXEC'
          file build/cognacos-kernel.exe | grep -q 'PE32+'
      - name: Package a GPT EFI System Partition image
        run: |
          sudo apt-get update
          sudo apt-get install -y dosfstools e2fsprogs mtools parted qemu-system-x86 ovmf swtpm llvm
          mkdir -p build/EFI/BOOT build/kernel
          if [[ -f build/cognacos-bootloader.signed.efi ]]; then
            cp build/cognacos-bootloader.signed.efi build/EFI/BOOT/BOOTX64.EFI
          else
            cp target/x86_64-unknown-uefi/release/cognacos-bootloader.efi build/EFI/BOOT/BOOTX64.EFI
          fi
          cp build/cognacos-kernel.exe build/EFI/BOOT/cognacos-kernel.exe
          cp build/cognacos-kernel.exe build/kernel/cognacos-kernel.exe
          cp target/x86_64-pc-windows-msvc/release/cognac_ntdll.dll build/EFI/BOOT/ntdll.dll
          cp test/beep.sys build/EFI/BOOT/beep.sys
          truncate -s 256M build/cognacos-uefi.img
          truncate -s 128M build/pagefile.img
          parted -s build/cognacos-uefi.img mklabel gpt
          # Keep the FAT32 EFI System Partition small and dedicate the remaining
          # disk space to a real ext4 data partition consumed by the guest.
          parted -s build/cognacos-uefi.img mkpart ESP fat32 1MiB 65MiB
          parted -s build/cognacos-uefi.img set 1 esp on
          # Keep the final 16 MiB as an explicit debug-trace partition.
          # The kernel writes only inside GPT entry 3; it never uses ext4 free space or GPT backup metadata.
          parted -s build/cognacos-uefi.img mkpart COGNACDATA ext4 65MiB 240MiB
          parted -s build/cognacos-uefi.img mkpart COGNACDEBUG ext4 240MiB 255MiB
          mformat -i build/cognacos-uefi.img@@1048576 -F -T 131072 ::
          mmd -i build/cognacos-uefi.img@@1048576 ::/EFI
          mmd -i build/cognacos-uefi.img@@1048576 ::/EFI/BOOT
          mcopy -i build/cognacos-uefi.img@@1048576 build/EFI/BOOT/BOOTX64.EFI ::/EFI/BOOT/BOOTX64.EFI
          mcopy -i build/cognacos-uefi.img@@1048576 build/EFI/BOOT/cognacos-kernel.exe ::/EFI/BOOT/cognacos-kernel.exe
          mcopy -i build/cognacos-uefi.img@@1048576 build/EFI/BOOT/ntdll.dll ::/EFI/BOOT/ntdll.dll
          mcopy -i build/cognacos-uefi.img@@1048576 build/EFI/BOOT/beep.sys ::/EFI/BOOT/beep.sys
          mkdir -p build/ext4-root
          printf '%s' 'Readme, I have a secret to kernel stability' > build/ext4-root/README.txt
          loopdev="$(sudo losetup --find --show --partscan build/cognacos-uefi.img)"
          cleanup_loop() { sudo losetup -d "$loopdev" 2>/dev/null || true; }
          trap cleanup_loop EXIT
          sudo udevadm settle
          if [[ ! -b "${loopdev}p2" ]]; then
            echo "GPT ext4 data partition was not exposed as ${loopdev}p2" >&2
            sudo parted -s build/cognacos-uefi.img print
            exit 1
          fi
          sudo mkfs.ext4 -F -q -L COGNACDATA -O ^metadata_csum,^huge_file,^dir_nlink,^extra_isize,^dir_index,^has_journal -d build/ext4-root "${loopdev}p2"
          # Validate the exact bytes stored in the filesystem, not merely the
          # source staging file. This does not substitute for the guest test.
          sudo debugfs -R 'cat /README.txt' "${loopdev}p2" 2>/dev/null > build/ext4-readback.txt
          printf '%s' 'Readme, I have a secret to kernel stability' > build/ext4-expected.txt
          cmp build/ext4-expected.txt build/ext4-readback.txt
          echo "GPT ext4 partition created; /README.txt contents verified byte-for-byte."
          cleanup_loop
          trap - EXIT
      - name: Validate source-level QEMU crash resolver
        run: |
          set -euo pipefail
          python3 -m py_compile tools/resolve_qemu_trace.py tools/test_resolve_qemu_trace.py
          python3 tools/resolve_qemu_trace.py --help >/dev/null
          python3 tools/test_resolve_qemu_trace.py
      - name: Boot smoke test under OVMF/QEMU
        shell: bash
        run: |
          set -euo pipefail
          # Select a matching CODE/VARS pair: mixing 2 MiB and 4 MiB
          # firmware images can make QEMU fail before the boot test starts.
          if [ -f /usr/share/OVMF/OVMF_CODE_4M.fd ] && [ -f /usr/share/OVMF/OVMF_VARS_4M.fd ]; then
            code=/usr/share/OVMF/OVMF_CODE_4M.fd
            vars_template=/usr/share/OVMF/OVMF_VARS_4M.fd
          elif [ -f /usr/share/OVMF/OVMF_CODE.fd ] && [ -f /usr/share/OVMF/OVMF_VARS.fd ]; then
            code=/usr/share/OVMF/OVMF_CODE.fd
            vars_template=/usr/share/OVMF/OVMF_VARS.fd
          else
            echo "No matching OVMF CODE/VARS firmware pair found" >&2
            find /usr/share/OVMF -maxdepth 1 -type f -print
            exit 1
          fi
          cp "$vars_template" build/OVMF_VARS.fd
          : > build/serial.log
          # Keep the original QEMU instance alive while GDB attaches. The old
          # timeout-based run killed QEMU before the diagnostic branch could run,
          # so its "GDB snapshot" silently started a second, unrelated boot.
          # Capture the legacy PC speaker output to a WAV artifact. The kernel
          # emits a diagnostic tone only after beep.sys DriverEntry and device
          # registration succeed; this proves the QEMU audio path, not the driver's IOCTL.
          rm -f build/beep.wav build/gdb-first-user-fault.txt
          command -v gdb >/dev/null || { sudo apt-get update && sudo apt-get install -y gdb; }
          # Attach GDB before firmware starts executing. A conditional hardware
          # breakpoint captures the first CPL3 exception frame and then resumes
          # automatically, so diagnostics do not depend on a post-crash attach.
          cat > build/gdb-first-fault.gdb <<'GDB'
          set pagination off
          set confirm off
          set architecture i386:x86-64
          file target/x86_64-unknown-none/release/cognacos-kernel
          target remote 127.0.0.1:12345
          hbreak cognacos_exception_dispatch
          condition 1 (*(unsigned long long *)($rdx + 144) & 3) == 3
          commands 1
            silent
            printf "\n===== GDB FIRST RING-3 EXCEPTION =====\n"
            printf "vector=%#lx error=%#lx frame=%#lx\n", $rdi, $rsi, $rdx
            printf "RIP=%#lx CS=%#lx RFLAGS=%#lx RSP=%#lx SS=%#lx\n", *(unsigned long long *)($rdx + 136), *(unsigned long long *)($rdx + 144), *(unsigned long long *)($rdx + 152), *(unsigned long long *)($rdx + 160), *(unsigned long long *)($rdx + 168)
            info registers cr2 cr3
            x/22gx $rdx
            set $fault_rip = *(unsigned long long *)($rdx + 136)
            printf "===== FAULTING USER INSTRUCTIONS (runtime-generated stub or PE image) =====\n"
            x/24i $fault_rip-24
            info symbol $fault_rip
            info line *$fault_rip
            printf "===== END GDB FIRST RING-3 EXCEPTION =====\n"
            continue
          end
          continue
          GDB
          # Attach a QEMU USB 3.x xHCI controller and an emulated HID keyboard.
          qemu-system-x86_64 \
            -audiodev wav,id=beepout,path=build/beep.wav \
            -machine pc,pcspk-audiodev=beepout -m 5G -cpu max -smp 4 \
            -device qemu-xhci,id=xhci \
            -device usb-kbd,bus=xhci.0 \
            -drive if=pflash,format=raw,readonly=on,file="$code" \
            -drive if=pflash,format=raw,file=build/OVMF_VARS.fd \
            -drive if=ide,format=raw,file=build/cognacos-uefi.img \
            -drive if=ide,format=raw,index=1,file=build/pagefile.img \
            -boot order=c -display none -monitor unix:build/qemu-monitor.sock,server=on,wait=off \
            -serial file:build/serial.log -gdb tcp::12345 \
            -d int,cpu_reset,guest_errors -D build/qemu-debug.log \
            -S -no-reboot -no-shutdown &
          qemu_pid=$!
          # Verify QEMU really attached both USB devices to this guest. This checks
          # emulated hardware topology only; it does not claim guest driver enumeration.
          python3 - <<'PY'
          import socket, time
          path = "build/qemu-monitor.sock"
          deadline = time.monotonic() + 10
          monitor = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          monitor.settimeout(2)
          while True:
              try:
                  monitor.connect(path)
                  break
              except (FileNotFoundError, ConnectionRefusedError):
                  if time.monotonic() >= deadline:
                      raise SystemExit("QEMU monitor did not become available")
                  time.sleep(0.1)
          def read_prompt():
              data = bytearray()
              end = time.monotonic() + 3
              while b"(qemu)" not in data and time.monotonic() < end:
                  try:
                      chunk = monitor.recv(65536)
                  except socket.timeout:
                      break
                  if not chunk:
                      break
                  data.extend(chunk)
              return data.decode("utf-8", "replace")
          read_prompt()
          monitor.sendall(b"info qtree\n")
          tree = read_prompt()
          monitor.close()
          for expected in ("qemu-xhci", "usb-kbd"):
              if expected not in tree:
                  raise SystemExit(f"QEMU USB topology missing {expected}:\n{tree}")
          print("QEMU USB topology verified: xHCI controller + emulated USB keyboard attached.")
          print("NOTE: this is a QEMU device-model check, not proof of CognacOS USB enumeration.")
          PY
          # Give QEMU's GDB stub time to bind before the client connects.
          sleep 1
          gdb -q -batch -x build/gdb-first-fault.gdb > build/gdb-first-user-fault.txt 2>&1 &
          gdb_pid=$!
          cleanup_qemu() {
            kill "$gdb_pid" 2>/dev/null || true
            kill "$qemu_pid" 2>/dev/null || true
            wait "$gdb_pid" 2>/dev/null || true
            wait "$qemu_pid" 2>/dev/null || true
          }
          trap cleanup_qemu EXIT

          # The NTDLL ABI smoke marker is emitted before the remaining PE,
          # process-exit, and scheduler tests. Do not stop QEMU at that intermediate
          # milestone: wait for process-lifecycle completion and a terminal timer result.
          # This leaves QEMU live at the actual failing instruction if later boot work hangs.
          for _ in $(seq 1 120); do
            if grep -Fq 'Ring-3 syscall dispatch, process exit, and PEB/TEB setup passed.' build/serial.log &&
               grep -Eq 'Timer preemption stress passed: non-yielding thread was preempted for a runnable peer\.|Timer preemption stress FAILED\.|WARNING: calibrated APIC timer could not start; interrupts remain disabled\.|Interrupts remain disabled because APIC/timer setup was not fully validated\.' build/serial.log; then
              break
            fi
            if ! kill -0 "$qemu_pid" 2>/dev/null; then
              echo "QEMU exited before ring-3 process-lifecycle and timer smoke tests completed." >&2
              cat build/serial.log || true
              exit 1
            fi
            sleep 0.25
          done

          if ! grep -Fq 'Ring-3 syscall dispatch, process exit, and PEB/TEB setup passed.' build/serial.log; then
            echo "Full ring-3 process-lifecycle smoke test did not complete; attaching GDB to the same live QEMU instance."
            command -v gdb >/dev/null || { sudo apt-get update && sudo apt-get install -y gdb; }
            # Stop the always-on first-fault monitor before taking the full
            # post-failure snapshot; only one GDB client may own this stub.
            kill "$gdb_pid" 2>/dev/null || true
            wait "$gdb_pid" 2>/dev/null || true
            echo "=== GDB first-user-fault snapshot captured during execution ==="
            cat build/gdb-first-user-fault.txt || true
            set +e
            # Load DWARF-bearing ELF companions so GDB can resolve source file:line
            # for the kernel and HAL, while attaching to the *same* failing QEMU.
            # The native NTDLL PE/PDB and all debug companions are preserved as artifacts.
            cat > build/gdb-diagnose.gdb <<'GDB'
            set pagination off
            set confirm off
            set print pretty on
            set print frame-arguments all
            set disassemble-next-line on
            set backtrace limit 80
            set architecture i386:x86-64
            set substitute-path /home/runner/work/CognacOS/CognacOS .
            file target/x86_64-unknown-none/release/cognacos-kernel
            target remote 127.0.0.1:12345
            echo \\n===== LIVE CPU / SOURCE LOCATION =====\\n
            info registers
            info threads
            thread apply all info registers rip rsp
            thread apply all info line *$rip
            info line *$rip
            list *$rip
            info symbol $rip
            x/32i $rip-32
            x/32gx $rsp
            echo \\n===== KERNEL BACKTRACE WITH SOURCE LINES =====\\n
            thread apply all bt full
            echo \\n===== HAL SYMBOL COMPANION =====\\n
            add-symbol-file target/driver-hal/x86_64-unknown-none/release/hal
            info symbol $rip
            info line *$rip
            echo \\n===== NTDLL SYMBOL/EXPORT CHECK =====\\n
            info sharedlibrary
            maintenance info sections
            detach
            quit
          GDB
            set +e
            gdb -q -batch -x build/gdb-diagnose.gdb > build/gdb-state.txt 2>&1
            gdb_status=$?
            set -e
            echo "=== GDB live failure snapshot (status=$gdb_status) ==="
            cat build/gdb-state.txt || true
            echo "=== Serial log at GDB attach ==="
            cat build/serial.log || true
            echo "=== QEMU CPU exception / reset trace ==="
            tail -n 500 build/qemu-debug.log || true
            # llvm-symbolizer discovers the CodeView PDB beside the PE image.
            # The linker writes it under build/ntdll, so stage a matching copy
            # next to the DLL before either NTDLL symbol-resolution diagnostic.
            if [[ -f build/ntdll/cognac_ntdll.pdb && -f target/x86_64-pc-windows-msvc/release/cognac_ntdll.dll ]]; then
              cp build/ntdll/cognac_ntdll.pdb target/x86_64-pc-windows-msvc/release/cognac_ntdll.pdb
            fi
            echo "=== Classify captured RIP and resolve NTDLL only when it belongs to that image ==="
            python3 - <<'PY'
          import re, struct, subprocess
          from pathlib import Path

          gdb = Path("build/gdb-state.txt").read_text(errors="replace")
          serial = Path("build/serial.log").read_text(errors="replace")
          m = re.search(r"\brip\s+0x([0-9a-fA-F]+)", gdb)
          if not m:
              print("GDB did not report RIP; retain gdb-state.txt and qemu-debug.log for manual analysis.")
              raise SystemExit(0)
          rip = int(m.group(1), 16)
          pe_path = Path("target/x86_64-pc-windows-msvc/release/cognac_ntdll.dll")
          if not pe_path.exists():
              print(f"NTDLL PE/PDB input missing: {pe_path}")
              raise SystemExit(0)
          blob = pe_path.read_bytes()
          if blob[:2] != b"MZ":
              print("NTDLL input is not a PE image.")
              raise SystemExit(0)
          pe = struct.unpack_from("<I", blob, 0x3c)[0]
          if blob[pe:pe+4] != b"PE\0\0":
              print("NTDLL PE signature is invalid.")
              raise SystemExit(0)
          opt = pe + 24
          image_base = struct.unpack_from("<Q", blob, opt + 24)[0]
          image_size = struct.unpack_from("<I", blob, opt + 56)[0]
          candidates = [int(x, 16) for x in re.findall(r"module=0x([0-9a-fA-F]+)", serial)]
          candidates.append(image_base)
          base = next((b for b in reversed(candidates) if b <= rip < b + image_size), None)
          if base is None:
              print(f"Captured RIP 0x{rip:x} is outside all known NTDLL image ranges; NTDLL preferred base=0x{image_base:x}, image size=0x{image_size:x}.")
              print("This is not evidence that execution was inside NTDLL or that the PE loader is broken.")
              print("Treat this RIP as a kernel/HAL/other-image address and use the kernel/HAL DWARF and QEMU exception trace above.")
              print("NTDLL source resolution requires a RIP inside its actual loaded image range; do not subtract the NTDLL preferred base from an unrelated address.")
              raise SystemExit(0)
          rva = rip - base
          print(f"NTDLL source resolution: RIP=0x{rip:x}, loaded_base=0x{base:x}, RVA=0x{rva:x}")
          cmd = ["llvm-symbolizer", "--obj=" + str(pe_path), "--relative-address", "--functions=linkage", "--demangle", hex(rva)]
          result = subprocess.run(cmd, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          print(result.stdout.rstrip() or "llvm-symbolizer returned no line information; inspect the archived PDB.")
          if result.returncode:
              print(f"llvm-symbolizer exit status: {result.returncode}")
          PY
            python3 tools/resolve_qemu_trace.py \
              --trace build/qemu-debug.log \
              --serial build/serial.log \
              --kernel target/x86_64-unknown-none/release/cognacos-kernel \
              --hal target/driver-hal/x86_64-unknown-none/release/hal \
              --ntdll target/x86_64-pc-windows-msvc/release/cognac_ntdll.dll \
              --gdb build/gdb-state.txt || true
            exit 1
          fi

          cleanup_qemu
          trap - EXIT
          cat build/serial.log
          grep -F 'Timer preemption stress passed: non-yielding thread was preempted for a runnable peer.' build/serial.log
          grep -F 'PCI xHCI discovered; driver binding deferred pending safe MMIO/DMA/IRQ resources.' build/serial.log
          grep -E '^QEMU xHCI DEVICE: BDF=' build/serial.log
          grep -E '^QEMU xHCI DEVICE COUNT=0x0*[1-9a-fA-F][0-9a-fA-F]*' build/serial.log
          grep -E '^xHCI PnP resource published: device_object=0x[0-9a-fA-F]+ MMIO_VA=0x[0-9a-fA-F]+ length=0x[0-9a-fA-F]+' build/serial.log
          grep -F 'PCI xHCI resource discovery and uncached MMIO mapping complete; driver binding remains gated on IOMMU and IRQ readiness.' build/serial.log
           grep -F 'CognacOS Rust kernel entered.' build/serial.log
          grep -F 'XSTATE processor policy initialized; enabled mask=' build/serial.log
          grep -F 'XSTATE XSAVE/XRSTOR processor self-test passed.' build/serial.log
          grep -F 'KUSER_SHARED_DATA XState mapping and read-only ABI test passed.' build/serial.log
          grep -F 'Bootloader verified kernel SHA-256 and Ed25519 code signature.' build/serial.log
          grep -F 'Kernel-owned CR3 activated successfully.' build/serial.log
          grep -F 'No TPM 2.0 measured-boot device; optional feature skipped.' build/serial.log
          grep -F 'Page-table inspection passed: high-half kernel sections, stack alias, low boot data, and guard pages validated.' build/serial.log
          grep -F 'High-RAM allocator and direct-map self-test passed.' build/serial.log
          grep -F 'NT memory manager: physical translation, validity, and checked-copy self-test passed.' build/serial.log
          grep -F 'Physical allocator initialized' build/serial.log
          grep -F 'Pagefile storage initialized on dedicated ATA primary-slave disk; slots:' build/serial.log
          grep -F 'Pagefile storage read/write self-test passed.' build/serial.log
          grep -F 'Pagefile-backed pageable eviction and fault-driven page-in self-test passed.' build/serial.log
          grep -F 'HAL CPU-local registry, MMIO bounds, and x86-64 primitives initialized.' build/serial.log
          grep -F 'SMP startup target validation passed.' build/serial.log
          grep -E 'SMP AP startup complete; online application processors: [1-9][0-9]*' build/serial.log
          grep -F 'Firmware ACPI MADT validated; enabled APs discovered:' build/serial.log
          grep -F 'I/O manager cancellation, in-flight ownership, and asynchronous completion tests passed.' build/serial.log
          grep -F 'WDM exactly-once completion and outstanding-IRP unload rundown self-test passed.' build/serial.log
          grep -F 'Security: CR0.WP enabled' build/serial.log
          grep -F 'Security: NX enabled; strict page policy follows' build/serial.log
          grep -F 'Security: 4 KiB page policy active; W^X enforced for kernel sections.' build/serial.log
          grep -F 'Security: kernel stack guard page unmapped.' build/serial.log
          grep -F 'Protection self-tests passed: read-only write trapped and NX execution trapped.' build/serial.log
          grep -F 'Process address-space and checked user-copy self-test passed.' build/serial.log
          grep -F 'Native NT syscall dispatcher QEMU self-test passed: five args, invalid buffers, unsupported IDs, and 17-arg stack copy.' build/serial.log
          grep -F 'NTDLL PE32+ image mapped and exports registered.' build/serial.log
          grep -F 'Per-process page-table isolation, same-VA non-aliasing, and supervisor mapping protection passed.' build/serial.log
          grep -F 'Security: ring-3 GDT/TSS RSP0 installed; IRETQ transition available.' build/serial.log
          grep -F 'Scheduler-owned bootstrap ETHREAD ready id=' build/serial.log
          grep -F '[EXCEPTION] ring-3 ETHREAD attached id=' build/serial.log
          grep -F 'PE32+ loader self-test passed; image base=0x0000200000000000 entry=0x0000200000001000 (RX section and RO/NX headers).' build/serial.log
          grep -F 'PE fixture: DLL export registration passed.' build/serial.log
          grep -F 'PE fixture: normal import binding passed.' build/serial.log
          grep -F 'PE fixture: delay import binding passed.' build/serial.log
          grep -F 'Windows API-set resolution and PE TLS/unwind registration passed.' build/serial.log
          grep -F 'PE TLS callbacks executed in ring 3; per-image TLS blocks initialized.' build/serial.log
          grep -F 'Ext filesystem parser self-test passed (read-only ext2/ext3/ext4 metadata; unsupported features rejected).' build/serial.log
          grep -F 'Storage port: QEMU IDE primary-master IDENTIFY and bounded LBA28 reads initialized.' build/serial.log
          grep -F 'Disk class: Harddisk0 and Partition1 registered in the kernel I/O manager; GPT data partition discovered by READ IRPs.' build/serial.log
          grep -F 'ext4: partition superblock read through the registered partition READ interface.' build/serial.log
          grep -F 'Guest ext4 README.txt bytes match expected content exactly.' build/serial.log
          grep -F 'Guest ext4 WRITE IRP modified existing README data and read it back exactly.' build/serial.log
          grep -F 'Guest ext4 README.txt restored and verified byte-for-byte after write test.' build/serial.log
          grep -F 'Guest ATA/GPT/ext4 read/write end-to-end test passed.' build/serial.log
          grep -F 'Ring-3 syscall dispatch, process exit, and PEB/TEB setup passed.' build/serial.log
          if grep -Fq 'CognacOS Rust NTDLL passed ring-3 tests through the unified Windows x64 SYSCALL ABI.' build/serial.log; then
            echo 'RING3 NTDLL RESULT: PASS'
          elif grep -Fq 'WARNING: CognacOS Rust NTDLL ring-3 smoke did not complete; any user fault was contained to its process. Continuing boot and downstream tests.' build/serial.log; then
            echo 'RING3 NTDLL RESULT: CONTAINED PROCESS FAILURE; downstream boot tests must still pass'
          else
