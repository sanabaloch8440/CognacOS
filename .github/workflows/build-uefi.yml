          cargo test --quiet --manifest-path tools/rust/Cargo.toml --target x86_64-unknown-linux-gnu qemu_trace::tests
      - name: Boot smoke test under OVMF/QEMU
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /usr/share/OVMF/OVMF_CODE_4M.fd ] && [ -f /usr/share/OVMF/OVMF_VARS_4M.fd ]; then
            code=/usr/share/OVMF/OVMF_CODE_4M.fd
            vars_template=/usr/share/OVMF/OVMF_VARS_4M.fd
          elif [ -f /usr/share/OVMF/OVMF_CODE.fd ] && [ -f /usr/share/OVMF/OVMF_VARS.fd ]; then
            code=/usr/share/OVMF/OVMF_CODE.fd
            vars_template=/usr/share/OVMF/OVMF_VARS.fd
          else
            echo "No matching OVMF CODE/VARS firmware pair found" >&2
            find /usr/share/OVMF -maxdepth 1 -type f -print
            exit 1
          fi
          cp "$vars_template" build/OVMF_VARS.fd
          : > build/serial.log
          rm -f build/beep.wav build/gdb-first-user-fault.txt
          command -v gdb >/dev/null || { sudo apt-get update && sudo apt-get install -y gdb; }
          cp scripts/gdb/first-fault.gdb build/gdb-first-fault.gdb
          # Dedicated blank primary-slave disk for the PCI IDE PIO round-trip test.
          truncate -s 8M build/ata-test.img
          qemu-system-x86_64 \
            -audiodev wav,id=beepout,path=build/beep.wav \
            -machine q35,pcspk-audiodev=beepout -m 5G -cpu max -smp 4 \
            -device intel-iommu,intremap=off,caching-mode=on,aw-bits=48 \
            -device qemu-xhci,id=xhci \
            -device piix3-ide,id=legacyide,bus=pcie.0 \
            -device usb-kbd,id=usbkbd,bus=xhci.0 \
            -drive if=pflash,format=raw,readonly=on,file="$code" \
            -drive if=pflash,format=raw,file=build/OVMF_VARS.fd \
            -drive if=none,id=osdisk,format=raw,file=build/cognacos-uefi.img \
            -device ide-hd,drive=osdisk,bus=legacyide.0,unit=0 \
            -drive if=none,id=atatest,format=raw,file=build/ata-test.img \
            -device ide-hd,drive=atatest,bus=legacyide.0,unit=1 \
            -boot order=c -display none -monitor unix:build/qemu-monitor.sock,server=on,wait=off \
            -serial file:build/serial.log -gdb tcp::12345 \
            -d int,cpu_reset,guest_errors -D build/qemu-debug.log \
            -no-reboot -no-shutdown &
          qemu_pid=$!
          python3 scripts/ci/check_qemu_topology.py
          cleanup_qemu() {
            kill "$qemu_pid" 2>/dev/null || true
            wait "$qemu_pid" 2>/dev/null || true
          }
          trap cleanup_qemu EXIT
          for _ in $(seq 1 120); do
            if grep -Fq 'Ring-3 syscall dispatch, process exit, and PEB/TEB setup passed.' build/serial.log &&
               grep -Eq 'Timer preemption stress passed: non-yielding thread was preempted for a runnable peer\.|Timer preemption stress FAILED\.|WARNING: calibrated APIC timer could not start; interrupts remain disabled\.|Interrupts remain disabled because APIC/timer setup was not fully validated\.' build/serial.log; then
              break
            fi
            if ! kill -0 "$qemu_pid" 2>/dev/null; then
              echo "QEMU exited before ring-3 process-lifecycle and timer smoke tests completed." >&2
              cat build/serial.log || true
              exit 1
            fi
            sleep 0.25
          done
          if ! grep -Fq 'Ring-3 syscall dispatch, process exit, and PEB/TEB setup passed.' build/serial.log ||
             ! grep -Fq 'VT-d: exact DRHD and scoped RMRR mappings installed for the full PCI bridge path.' build/serial.log ||
             ! grep -Fq 'xHCI bind: DriverEntry succeeded' build/serial.log ||
             ! grep -Fq 'xHCI PCI bus mastering enabled after VT-d domain, DMA mappings, and IRQ registration.' build/serial.log; then
            echo "Ring-3 or PCI/VT-d/xHCI bring-up did not complete; attaching GDB to the same live QEMU instance."
            command -v gdb >/dev/null || { sudo apt-get update && sudo apt-get install -y gdb; }
            echo "=== GDB first-user-fault monitor ==="
            echo "Not run during normal boot; collecting a live snapshot after failure."
            set +e
            cp scripts/gdb/diagnose.gdb build/gdb-diagnose.gdb
            gdb -q -batch -x build/gdb-diagnose.gdb > build/gdb-state.txt 2>&1
            gdb_status=$?
            if [[ -f cognacos-gdb-forensics.txt ]]; then cp cognacos-gdb-forensics.txt build/; fi
            set -e
            echo "=== GDB live failure snapshot (status=$gdb_status) ==="
            cat build/gdb-state.txt || true
            echo "=== Serial log at GDB attach ==="
            cat build/serial.log || true
            echo "=== QEMU CPU exception / reset trace ==="
            tail -n 500 build/qemu-debug.log || true
            if [[ -f build/ntdll/cognac_ntdll.pdb && -f target/x86_64-pc-windows-msvc/release/cognac_ntdll.dll ]]; then
              cp build/ntdll/cognac_ntdll.pdb target/x86_64-pc-windows-msvc/release/cognac_ntdll.pdb
            fi
            echo "=== Classify captured RIP and resolve NTDLL only when it belongs to that image ==="
            python3 scripts/ci/classify_fault_rip.py
            cargo run --quiet --target x86_64-unknown-linux-gnu --manifest-path tools/rust/Cargo.toml -- resolve-qemu-trace \
              --trace build/qemu-debug.log \
              --serial build/serial.log \
              --kernel target/x86_64-unknown-none/debug/cognacos-kernel \
              --hal target/driver-hal/x86_64-unknown-none/release/hal \
              --ntdll target/x86_64-pc-windows-msvc/release/cognac_ntdll.dll \
              --gdb build/gdb-state.txt || true
            exit 1
          fi
          grep -F 'VT-d: exact DRHD and scoped RMRR mappings installed for the full PCI bridge path.' build/serial.log
          grep -F 'xHCI bind: DriverEntry succeeded' build/serial.log
          grep -F 'xHCI PCI bus mastering enabled after VT-d domain, DMA mappings, and IRQ registration.' build/serial.log
          grep -F 'pciide: ATA PIO read/write/flush round-trip passed' build/serial.log
          cleanup_qemu
          trap - EXIT
          cat build/serial.log
          grep -F 'Timer preemption stress passed: non-yielding thread was preempted for a runnable peer.' build/serial.log
          grep -F 'xHCI bind: loading PE32+ usbxhci.sys bytes=' build/serial.log
          grep -F 'VT-d: exact DRHD and scoped RMRR mappings installed for the full PCI bridge path.' build/serial.log
          grep -F 'xHCI bind: DriverEntry succeeded' build/serial.log
          grep -F 'xHCI PCI bus mastering enabled after VT-d domain, DMA mappings, and IRQ registration.' build/serial.log
          grep -E '^xHCI bind: (safe IOMMU DMA or masked interrupt route unavailable|required HAL/device services are incomplete|loading PE32\+ usbxhci.sys|PE image load or DriverEntry failed|DriverEntry succeeded)' build/serial.log || grep -F 'PCI xHCI detected but no safe PnP MMIO resource could be published.' build/serial.log
          grep -F 'CognacOS Rust kernel entered.' build/serial.log
          grep -F 'XSTATE processor policy initialized; enabled mask=' build/serial.log
          grep -F 'XSTATE XSAVE/XRSTOR processor self-test passed.' build/serial.log
          grep -F 'KUSER_SHARED_DATA XState mapping and read-only ABI test passed.' build/serial.log
          grep -F 'Bootloader verified kernel SHA-256 and Ed25519 code signature.' build/serial.log
          grep -F 'Kernel-owned CR3 activated successfully.' build/serial.log
          grep -F 'No TPM 2.0 measured-boot device; optional feature skipped.' build/serial.log
          grep -F 'Page-table inspection passed: high-half kernel sections, stack alias, low boot data, and guard pages validated.' build/serial.log
          grep -F 'High-RAM allocator and direct-map self-test passed.' build/serial.log
          grep -F 'NT memory manager: physical translation, validity, and checked-copy self-test passed.' build/serial.log
          grep -F 'Physical allocator initialized' build/serial.log
          grep -F 'HAL CPU-local registry, MMIO bounds, and x86-64 primitives initialized.' build/serial.log
          grep -F 'SMP startup target validation passed.' build/serial.log
          grep -E 'SMP AP startup complete; online application processors: [1-9][0-9]*' build/serial.log
          grep -F 'Firmware ACPI MADT validated; enabled APs discovered:' build/serial.log
          grep -F 'I/O manager cancellation, in-flight ownership, and asynchronous completion tests passed.' build/serial.log
          grep -F 'WDM exactly-once completion and outstanding-IRP unload rundown self-test passed.' build/serial.log
          grep -F 'Security: CR0.WP enabled' build/serial.log
          grep -F 'Security: NX enabled; strict page policy follows' build/serial.log
          grep -F 'Security: 4 KiB page policy active; W^X enforced for kernel sections.' build/serial.log
          grep -F 'Security: kernel stack guard page unmapped.' build/serial.log
          grep -F 'Protection self-tests passed: read-only write trapped and NX execution trapped.' build/serial.log
          grep -F 'Process address-space and checked user-copy self-test passed.' build/serial.log
          grep -F 'Native NT syscall dispatcher QEMU self-test passed: five args, invalid buffers, unsupported IDs, and 17-arg stack copy.' build/serial.log
          grep -F 'NTDLL PE32+ image mapped and exports registered.' build/serial.log
          grep -F 'Per-process page-table isolation, same-VA non-aliasing, and supervisor mapping protection passed.' build/serial.log
          grep -F 'Security: ring-3 GDT/TSS RSP0 installed; IRETQ transition available.' build/serial.log
          grep -F 'Scheduler-owned bootstrap ETHREAD ready id=' build/serial.log
          grep -F '[EXCEPTION] ring-3 ETHREAD attached id=' build/serial.log
          grep -F 'PE32+ loader self-test passed; image base=0x0000200000000000 entry=0x0000200000001000 (RX section and RO/NX headers).' build/serial.log
          grep -F 'PE fixture: DLL export registration passed.' build/serial.log
          grep -F 'PE fixture: normal import binding passed.' build/serial.log
          grep -F 'PE fixture: delay import binding passed.' build/serial.log
          grep -F 'Windows API-set resolution and PE TLS/unwind registration passed.' build/serial.log
