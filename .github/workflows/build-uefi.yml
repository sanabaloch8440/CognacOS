          cargo run --quiet --target x86_64-unknown-linux-gnu --manifest-path tools/rust/Cargo.toml -- validate-pe-exports build/cognacos-kernel-release.exe ntoskrnl/src/abi/manifests/26100.json SeAccessCheck SePrivilegeCheck SeSinglePrivilegeCheck SeValidSecurityDescriptor SeCaptureSubjectContext SeReleaseSubjectContext SeLockSubjectContext SeUnlockSubjectContext PsAssignImpersonationToken PsReferencePrimaryToken PsDereferencePrimaryToken IoAllocateIrp IoFreeIrp IoBuildDeviceIoControlRequest IoCallDriver IoCompleteRequest IoAcquireCancelSpinLock IoReleaseCancelSpinLock IoCsqInitialize IoCsqInitializeEx IoCsqInsertIrp IoCsqInsertIrpEx IoCsqRemoveIrp IoCsqRemoveNextIrp
          python3 scripts/ci/validate_kernel_pe.py
      - name: Pin PE32+ kernel digest into Rust bootloader trust anchor
        id: kernel-digest
        shell: bash
        run: |
          digest="$(sha256sum build/cognacos-kernel.exe | cut -d' ' -f1)"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
      - name: Sign PE32+ kernel and prepare verification key
        id: kernel-sign
        shell: bash
        env:
          COGNACOS_SIGNING_PRIVATE_KEY: ${{ secrets.COGNACOS_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p build
          if [[ -n "${COGNACOS_SIGNING_PRIVATE_KEY:-}" ]]; then
            printf '%s' "$COGNACOS_SIGNING_PRIVATE_KEY" > build/cognacos-kernel-signing.pem
            echo "Using repository-configured CognacOS signing key."
          else
            openssl genpkey -algorithm ED25519 -out build/cognacos-kernel-signing.pem
            echo "No release signing secret configured; using an ephemeral CI-only key."
          fi
          openssl pkey -in build/cognacos-kernel-signing.pem -pubout -outform DER -out build/cognacos-kernel-public.der
          openssl pkeyutl -sign -rawin -inkey build/cognacos-kernel-signing.pem -in build/cognacos-kernel.exe -out build/cognacos-kernel.sig
          public_key="$(tail -c 32 build/cognacos-kernel-public.der | xxd -p -c 64)"
          signature="$(xxd -p -c 128 build/cognacos-kernel.sig)"
          test "${#public_key}" -eq 64
          test "${#signature}" -eq 128
          openssl pkeyutl -verify -rawin -pubin -keyform DER -inkey build/cognacos-kernel-public.der -in build/cognacos-kernel.exe -sigfile build/cognacos-kernel.sig
          cp build/cognacos-kernel.exe build/cognacos-kernel-tampered.exe
          python3 scripts/ci/tamper_kernel_byte.py build/cognacos-kernel-tampered.exe
          if openssl pkeyutl -verify -rawin -pubin -keyform DER -inkey build/cognacos-kernel-public.der -in build/cognacos-kernel-tampered.exe -sigfile build/cognacos-kernel.sig >/dev/null 2>&1; then
            echo "Tampered kernel incorrectly passed signature verification." >&2
            exit 1
          fi
          rm -f build/cognacos-kernel-tampered.exe
          echo "Valid signature accepted and tampered kernel rejected."
          echo "public_key=$public_key" >> "$GITHUB_OUTPUT"
          echo "signature=$signature" >> "$GITHUB_OUTPUT"
          rm -f build/cognacos-kernel-signing.pem
      - name: Build Rust UEFI bootloader with pinned kernel trust anchors
        env:
          COGNACOS_KERNEL_SHA256: ${{ steps.kernel-digest.outputs.sha256 }}
          COGNACOS_KERNEL_SIGNATURE: ${{ steps.kernel-sign.outputs.signature }}
          COGNACOS_SIGNING_PUBLIC_KEY: ${{ steps.kernel-sign.outputs.public_key }}
          RUSTFLAGS: '--cfg curve25519_dalek_backend="serial"'
          CARGO_PROFILE_RELEASE_OPT_LEVEL: 2
        run: cargo build --manifest-path bootloader/Cargo.toml --target x86_64-unknown-uefi --release
      - name: Optionally sign the UEFI bootloader for firmware Secure Boot
        shell: bash
        env:
          COGNACOS_SECURE_BOOT_CERT: ${{ secrets.COGNACOS_SECURE_BOOT_CERT }}
          COGNACOS_SECURE_BOOT_KEY: ${{ secrets.COGNACOS_SECURE_BOOT_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "${COGNACOS_SECURE_BOOT_CERT:-}" && -n "${COGNACOS_SECURE_BOOT_KEY:-}" ]]; then
            sudo apt-get update
            sudo apt-get install -y sbsigntool
            printf '%s' "$COGNACOS_SECURE_BOOT_CERT" > build/cognacos-secure-boot.crt
            printf '%s' "$COGNACOS_SECURE_BOOT_KEY" > build/cognacos-secure-boot.key
            sbsign --key build/cognacos-secure-boot.key --cert build/cognacos-secure-boot.crt --output build/cognacos-bootloader.signed.efi target/x86_64-unknown-uefi/release/cognacos-bootloader.efi
            sbverify --cert build/cognacos-secure-boot.crt build/cognacos-bootloader.signed.efi
            rm -f build/cognacos-secure-boot.key
            echo "UEFI bootloader signed with configured Secure Boot certificate."
          else
            echo "WARNING: no firmware Secure Boot signing certificate configured; bootloader is unsigned and Secure Boot firmware will reject it."
          fi
      - name: Validate source ELF and PE32+ kernel image
        run: |
          file target/x86_64-unknown-none/debug/cognacos-kernel build/cognacos-kernel.exe
          readelf -h target/x86_64-unknown-none/release/cognacos-kernel | grep -qE 'Class:.*ELF64'
          readelf -h target/x86_64-unknown-none/release/cognacos-kernel | grep -qE 'Machine:.*X86-64'
          readelf -h target/x86_64-unknown-none/release/cognacos-kernel | grep -qE 'Type:.*EXEC'
          file build/cognacos-kernel.exe | grep -q 'PE32+'
      - name: Validate reusable source-level GDB helpers
        shell: bash
        run: |
          set -euo pipefail
          command -v gdb >/dev/null || { sudo apt-get update && sudo apt-get install -y gdb; }
          mkdir -p build
          gdb -q -batch target/x86_64-unknown-none/release/cognacos-kernel \
            -x tools/gdb/cognacos-forensics.gdb \
            -ex 'help cognacos-forensics' \
            > build/gdb-helper-validation.txt 2>&1
          cat build/gdb-helper-validation.txt
          grep -Fq 'CognacOS GDB forensic helpers loaded.' build/gdb-helper-validation.txt
          grep -Fq 'Capture a reproducible register, stack, instruction, DWARF, and mapping snapshot' build/gdb-helper-validation.txt
          echo "PASS: reusable GDB commands parse and load against the release DWARF ELF."
      - name: Package a GPT EFI System Partition image
        run: |
          sudo apt-get update
          sudo apt-get install -y dosfstools e2fsprogs mtools parted qemu-system-x86 ovmf swtpm llvm gdb
          mkdir -p build/EFI/BOOT build/kernel build/ntoskrnl build/EFI/CognacOS/Hives
          test -s build/registry/SYSTEM
          cp build/registry/SYSTEM build/EFI/CognacOS/Hives/SYSTEM
          if [[ -f build/cognacos-bootloader.signed.efi ]]; then
            cp build/cognacos-bootloader.signed.efi build/EFI/BOOT/BOOTX64.EFI
          else
            cp target/x86_64-unknown-uefi/release/cognacos-bootloader.efi build/EFI/BOOT/BOOTX64.EFI
          fi
          cp build/cognacos-kernel.exe build/EFI/BOOT/cognacos-kernel.exe
          cp build/cognacos-kernel.exe build/ntoskrnl/cognacos-kernel.exe
          cp target/x86_64-pc-windows-msvc/release/cognac_ntdll.dll build/EFI/BOOT/ntdll.dll
          cp build/dlls/kernel32.dll build/EFI/BOOT/kernel32.dll
          cp build/dlls/kernelbase.dll build/EFI/BOOT/kernelbase.dll
          cp build/dlls/shell32.dll build/EFI/BOOT/shell32.dll
          cp build/dlls/msvcrt.dll build/EFI/BOOT/msvcrt.dll
          cp build/kbdus/kbdus.dll build/EFI/BOOT/kbdus.dll
          if [[ -f test/beep.sys ]]; then
            cp test/beep.sys build/EFI/BOOT/beep.sys
          else
            echo "BEEP.SYS IMAGE INPUT: NOT INCLUDED - test/beep.sys is absent."
          fi
          truncate -s 256M build/cognacos-uefi.img
          parted -s build/cognacos-uefi.img mklabel gpt
          parted -s build/cognacos-uefi.img mkpart ESP fat32 1MiB 65MiB
          parted -s build/cognacos-uefi.img set 1 esp on
          parted -s build/cognacos-uefi.img mkpart COGNACDATA fat32 65MiB 255MiB
          mformat -i build/cognacos-uefi.img@@1048576 -F -T 131072 ::
          mmd -i build/cognacos-uefi.img@@1048576 ::/EFI
          mmd -i build/cognacos-uefi.img@@1048576 ::/EFI/BOOT
          mmd -i build/cognacos-uefi.img@@1048576 ::/EFI/CognacOS
          mmd -i build/cognacos-uefi.img@@1048576 ::/EFI/CognacOS/Hives
          mmd -i build/cognacos-uefi.img@@1048576 ::/System32
          mmd -i build/cognacos-uefi.img@@1048576 ::/System32/drivers
          mcopy -i build/cognacos-uefi.img@@1048576 build/drivers/*.sys ::/System32/drivers/
          mcopy -i build/cognacos-uefi.img@@1048576 build/drivers/Hal.dll ::/System32/drivers/Hal.dll
          mcopy -i build/cognacos-uefi.img@@1048576 build/EFI/CognacOS/Hives/SYSTEM ::/EFI/CognacOS/Hives/SYSTEM
          mcopy -i build/cognacos-uefi.img@@1048576 build/EFI/BOOT/BOOTX64.EFI ::/EFI/BOOT/BOOTX64.EFI
          mcopy -i build/cognacos-uefi.img@@1048576 build/EFI/BOOT/cognacos-kernel.exe ::/EFI/BOOT/cognacos-kernel.exe
          mcopy -i build/cognacos-uefi.img@@1048576 build/EFI/BOOT/ntdll.dll ::/EFI/BOOT/ntdll.dll
          mcopy -i build/cognacos-uefi.img@@1048576 build/EFI/BOOT/kernel32.dll ::/EFI/BOOT/kernel32.dll
          mcopy -i build/cognacos-uefi.img@@1048576 build/EFI/BOOT/kernelbase.dll ::/EFI/BOOT/kernelbase.dll
          mcopy -i build/cognacos-uefi.img@@1048576 build/EFI/BOOT/shell32.dll ::/EFI/BOOT/shell32.dll
          mcopy -i build/cognacos-uefi.img@@1048576 build/EFI/BOOT/msvcrt.dll ::/EFI/BOOT/msvcrt.dll
          mcopy -i build/cognacos-uefi.img@@1048576 build/EFI/BOOT/kbdus.dll ::/EFI/BOOT/kbdus.dll
          if [[ -f build/EFI/BOOT/beep.sys ]]; then
            mcopy -i build/cognacos-uefi.img@@1048576 build/EFI/BOOT/beep.sys ::/EFI/BOOT/beep.sys
          fi
          mkdir -p build/fat32-root
          printf '%s' 'CognacOS FAT32 data volume' > build/fat32-root/README.txt
          printf '%s' '................................' > build/fat32-root/COGNACOS.TST
          # Format the second GPT partition through mtools' byte-offset support.
          # This avoids attaching a loop partition and then accessing its block node
          # as an unprivileged runner user (which fails with /dev/loopNp2 EACCES).
          data_offset=$((65 * 1024 * 1024))
          data_sectors=$((190 * 1024 * 1024 / 512))
          mformat -i "build/cognacos-uefi.img@@${data_offset}" -F -T "${data_sectors}" -v COGNACDATA ::
          mcopy -i "build/cognacos-uefi.img@@${data_offset}" build/fat32-root/README.txt ::/README.txt
          mcopy -i "build/cognacos-uefi.img@@${data_offset}" build/fat32-root/COGNACOS.TST ::/COGNACOS.TST
          mcopy -i "build/cognacos-uefi.img@@${data_offset}" ::/README.txt build/fat32-readback.txt
          cmp build/fat32-root/README.txt build/fat32-readback.txt
          echo "FAT32 data volume verified and seeded with the kernel storage round-trip fixture."
      - name: Validate source-level QEMU crash resolver
        run: |
