            grep -F "Per-CPU TSS/IST setup self-test passed." "$log"
            grep -F "Per-CPU interrupt setup stress passed: 64 acknowledged IPIs per online AP." "$log"
            grep -F "SMP scheduler, cross-CPU wakeup, contended-lock, IRP/object teardown stress passed." "$log"
            grep -F "SMP WDM IRP cancellation, cancel-spin-lock, callback, and completion test passed." "$log"
            grep -F "WDM exactly-once completion and outstanding-IRP unload rundown self-test passed." "$log"
            mcopy -i build/cognacos-uefi.img@@68157440 ::/COGNACOS.TST "build/fat32-storage-test-smp-$cpus.bin"
            cmp build/fat32-storage-test-expected.bin "build/fat32-storage-test-smp-$cpus.bin"
            grep -F "Kernel VM extent stress and SMP TLB shootdown self-test passed." "$log"
          done
      - name: Verify captured QEMU PC speaker tone
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/beep-driver-assessment
          report=build/beep-driver-assessment/audio.txt
          {
            echo
            echo "=== QEMU PC speaker audio capture ==="
            if [[ ! -s build/beep.wav ]]; then
              echo "AUDIO RESULT: INCOMPLETE - QEMU did not produce build/beep.wav; audio capture is supplemental and cannot invalidate kernel build/boot checks."
              exit 0
            fi
            python3 scripts/ci/verify_audio.py
          } | tee -a "$report"
      - name: Assess Microsoft beep.sys PE compatibility
        if: always()
        shell: bash
        run: |
          mkdir -p build/beep-driver-assessment
          if ! command -v llvm-readobj >/dev/null || ! command -v llvm-objdump >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y llvm
          fi
          if [ ! -f test/beep.sys ]; then
            echo "BEEP.SYS ASSESSMENT: NOT RUN - test/beep.sys is not present; no compatibility claim is made. Build and boot checks remain authoritative."
            exit 0
          fi
          log=build/beep-driver-assessment/output.txt
          set +e
          {
            echo "CognacOS Microsoft beep.sys compatibility assessment"
            echo "Commit: ${GITHUB_SHA}"
            echo "Mode: static PE inspection plus QEMU guest runtime DriverEntry attempt."
            echo
            echo "Input: test/beep.sys"
            sha256sum test/beep.sys
            echo
            llvm-readobj --file-headers --coff-imports test/beep.sys
            echo
            echo "=== beep.sys disassembly (full image; DriverEntry RVA is 0x6010) ==="
            llvm-objdump -D --print-imm-hex test/beep.sys
          } > "$log" 2>&1
          status=$?
          set -e
          cat "$log"
          if [ "$status" -ne 0 ]; then
            echo "STATIC RESULT: INCOMPLETE - llvm-readobj/llvm-objdump could not inspect the optional beep.sys sample; kernel, storage-driver and QEMU checks continue." | tee -a "$log"
          elif ! grep -Eq 'Machine: IMAGE_FILE_MACHINE_AMD64|Machine: AMD64' "$log"; then
            echo "STATIC RESULT: INCOMPLETE - beep.sys did not report an AMD64 machine header; this optional sample does not block boot/storage validation." | tee -a "$log"
          elif ! grep -Fq 'Magic: 0x20B' "$log"; then
            echo "STATIC RESULT: INCOMPLETE - beep.sys did not report PE32+; this optional sample does not block boot/storage validation." | tee -a "$log"
          else
            echo "STATIC RESULT: PASS - AMD64 PE32+ headers and import table parsed successfully." | tee -a "$log"
          fi
          echo
          echo "=== QEMU runtime driver-load result ===" | tee -a "$log"
          if [ -f build/serial.log ]; then
            echo "=== NTOSKRNL structured debug trace / crash diagnostics ===" | tee -a "$log"
            grep -E "NTOSKRNL DEBUG TRACE|^DBG |beep\\.sys|DriverEntry|driver test|FATAL CPU exception|PAGEFAULT|RAX=" build/serial.log | tee -a "$log" || true
            if grep -Fq "NTOSKRNL DEBUG TRACE" build/serial.log; then
              echo "TRACE RESULT: structured kernel trace dump was emitted into the retained serial log." | tee -a "$log"
            else
              echo "TRACE RESULT: no explicit ring dump in serial output; the ring is currently dumped on fatal paths, not every successful boot." | tee -a "$log"
            fi
            if grep -Fq "beep.sys device and dispatch registration passed." build/serial.log; then
              echo "RUNTIME RESULT: PASS - DriverEntry succeeded and registered a device plus dispatch handlers." | tee -a "$log"
            elif grep -Fq "beep.sys DriverEntry returned NTSTATUS success" build/serial.log; then
              echo "RUNTIME RESULT: PARTIAL - DriverEntry succeeded, but expected device/dispatch registration was not verified." | tee -a "$log"
            elif grep -Fq "beep.sys runtime load failed before successful DriverEntry" build/serial.log; then
              echo "RUNTIME RESULT: NOT COMPATIBLE YET - the kernel loader reported a prerequisite/import/entry failure." | tee -a "$log"
            elif grep -Fq "Runtime driver test: attempting native beep.sys load and DriverEntry." build/serial.log; then
              echo "RUNTIME RESULT: INCOMPLETE - load was attempted but no terminal loader result was logged; inspect serial/QEMU diagnostics." | tee -a "$log"
            else
              echo "RUNTIME RESULT: NOT RUN - the kernel did not reach the beep.sys load point." | tee -a "$log"
            fi
          else
            echo "RUNTIME RESULT: NOT RUN - no QEMU serial log was produced." | tee -a "$log"
          fi
          if grep -Fq "BEEP DISPATCH RESULT: PASS" build/serial.log 2>/dev/null; then
            echo "BEEP DEVICE-CONTROL RESULT: PASS - create succeeded and IOCTL reached the registered beep.sys dispatch routine (STATUS_SUCCESS or STATUS_PENDING accepted)." | tee -a "$log"
          elif grep -Fq "BEEP DISPATCH RESULT: FAIL" build/serial.log 2>/dev/null; then
            echo "BEEP DEVICE-CONTROL RESULT: FAIL - dispatch was missing or returned a failing NTSTATUS." | tee -a "$log"
          else
            echo "BEEP DEVICE-CONTROL RESULT: NOT VERIFIED - runtime log has no successful dispatch result." | tee -a "$log"
          fi
          if [[ -f build/beep-driver-assessment/audio.txt ]]; then
            cat build/beep-driver-assessment/audio.txt | tee -a "$log"
          fi
          if grep -Fq "beep.sys device and dispatch registration passed." build/serial.log 2>/dev/null &&
             grep -Fq "BEEP DISPATCH RESULT: PASS" build/serial.log 2>/dev/null; then
            echo "FINAL RESULT: PASS - driver initialization and device-control dispatch succeeded/accepted; speaker audio capture is reported separately." | tee -a "$log"
          else
            echo "FINAL RESULT: INCOMPLETE - review driver initialization, device-control dispatch, and audio capture results above." | tee -a "$log"
          fi
