          python3 tools/elf_to_pe32plus.py target/x86_64-unknown-none/release/cognacos-kernel build/cognacos-kernel.exe --export-manifest kernel/src/ntoskrnl/manifest_26100.json
          file build/cognacos-kernel.exe
          python3 tools/validate_pe_exports.py build/cognacos-kernel.exe kernel/src/ntoskrnl/manifest_26100.json --require SeAccessCheck --require SePrivilegeCheck --require SeSinglePrivilegeCheck --require SeValidSecurityDescriptor --require SeCaptureSubjectContext --require SeReleaseSubjectContext --require SeLockSubjectContext --require SeUnlockSubjectContext --require PsAssignImpersonationToken --require PsReferencePrimaryToken --require PsDereferencePrimaryToken --require IoAllocateIrp --require IoFreeIrp --require IoBuildDeviceIoControlRequest --require IoCallDriver --require IoCompleteRequest --require IoAcquireCancelSpinLock --require IoReleaseCancelSpinLock --require IoCsqInitialize --require IoCsqInitializeEx --require IoCsqInsertIrp --require IoCsqInsertIrpEx --require IoCsqRemoveIrp --require IoCsqRemoveNextIrp
          python3 - <<'PY'
          import struct
          p = open("build/cognacos-kernel.exe", "rb").read()
          assert p[:2] == b"MZ", "missing DOS MZ signature"
          off = struct.unpack_from("<I", p, 0x3c)[0]
          assert p[off:off+4] == b"PE\0\0", "missing PE signature"
          assert struct.unpack_from("<H", p, off+4)[0] == 0x8664, "not AMD64"
          assert struct.unpack_from("<H", p, off+24)[0] == 0x20b, "not PE32+"
          sections = struct.unpack_from("<H", p, off+6)[0]
          opt = off + 24
          assert struct.unpack_from("<Q", p, opt+24)[0] == 0xffffffff7fe00000, "unexpected kernel image base"
          assert struct.unpack_from("<H", p, opt+68)[0] == 1, "kernel must use native subsystem"
          assert struct.unpack_from("<II", p, opt+112+8) == (0, 0), "kernel imports are unsupported"
          assert struct.unpack_from("<II", p, opt+112+5*8) == (0, 0), "kernel relocations are unsupported"
          table = opt + struct.unpack_from("<H", p, off+20)[0]
          assert all(struct.unpack_from("<I", p, table+i*40+12)[0] >= 0x1000 for i in range(sections)), "invalid section RVA"
