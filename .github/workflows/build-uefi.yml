name: Build and boot-test CognacOS Rust UEFI kernel

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'assets/**'
      - '_config.yml'
      - 'index.html'
      - 'Gemfile'
      - 'Gemfile.lock'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'assets/**'
      - '_config.yml'
      - 'index.html'
      - 'Gemfile'
      - 'Gemfile.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rust-os:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      # Keep DWARF line tables and frame pointers in the ELF symbol companions
      # used by GDB. PE artifacts remain the actual boot/runtime images.
      CARGO_PROFILE_RELEASE_DEBUG: "2"
      CARGO_PROFILE_RELEASE_STRIP: "none"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust targets
        run: |
          rustup update stable
          rustup target add x86_64-unknown-uefi x86_64-unknown-none x86_64-pc-windows-msvc
      - name: Ensure third-party filesystem sources are absent
        shell: bash
        run: |
          set -euo pipefail
          if git ls-tree HEAD third_party/Ext3Fsd | grep -q .; then
            echo "Third-party filesystem driver gitlink must not be present in the source tree." >&2
            exit 1
          fi
          test ! -e third_party/Ext3Fsd
          test ! -e third_party/README.md
      - name: Reject HAL dependencies on NTOSKRNL and ACPI
        shell: bash
        run: |
          set -euo pipefail
          if grep -nF -e 'crate::ntoskrnl' -e 'crate::acpi::' kernel/src/hal.rs kernel/src/hal/apic.rs; then
            echo "HAL implementation must not depend on ntoskrnl or ACPI parsing types." >&2
            exit 1
          fi
      - name: Reject obsolete root APIC references
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInF 'crate::apic' kernel/src --include='*.rs' || grep -RInE 'use crate::\{[^}]*apic' kernel/src --include='*.rs'; then
            echo "APIC implementation must only be reached through HAL service contracts." >&2
            exit 1
          fi
      - name: Verify independent platform driver boundaries
        shell: bash
        run: |
          set -euo pipefail
          test ! -e kernel/src/acpi.rs
          test ! -e kernel/src/pci.rs
          grep -Fq '#![no_std]' drivers/acpi/src/lib.rs
          grep -Fq '#![no_std]' drivers/pci/src/lib.rs
          echo "HAL and independent driver source-boundary checks passed."
      - name: Test shared Windows x64 NT ABI layouts
        run: cargo test --manifest-path shared/nt-abi/Cargo.toml --target x86_64-unknown-linux-gnu --lib
      - name: Check HAL contract library
        run: cargo check --manifest-path drivers/hal/Cargo.toml --lib
      - name: Test HAL versioned device service contracts
        run: cargo test --manifest-path drivers/hal/Cargo.toml --target x86_64-unknown-linux-gnu --lib
      - name: Check ACPI driver library
        run: cargo check --manifest-path drivers/acpi/Cargo.toml --lib
      - name: Check PCI driver library
        run: cargo check --manifest-path drivers/pci/Cargo.toml --lib
      - name: Test PCI ECAM and xHCI resource decoding
        run: cargo test --manifest-path drivers/pci/Cargo.toml --target x86_64-unknown-linux-gnu --lib
      - name: Check processor driver library
        run: cargo check --manifest-path drivers/processor/Cargo.toml --lib
      - name: Check ext4 driver library
        run: cargo check --manifest-path drivers/ext4/Cargo.toml --lib
      - name: Check storage stack library
        run: cargo check --manifest-path drivers/storage/Cargo.toml --lib
      - name: Test storage protocol and disk-class primitives
        run: cargo test --manifest-path drivers/storage/Cargo.toml --target x86_64-unknown-linux-gnu --lib
      - name: Check keyboard class driver
        run: cargo check --manifest-path drivers/kbdclass/Cargo.toml --lib
      - name: Test keyboard class queue and exclusive ownership
        run: cargo test --manifest-path drivers/kbdclass/Cargo.toml --target x86_64-unknown-linux-gnu --lib
      - name: Check US keyboard layout translation core
        run: cargo check --manifest-path drivers/kbdus/Cargo.toml --lib
      - name: Test US keyboard layout scan-code, modifiers, and text translation
        run: cargo test --manifest-path drivers/kbdus/Cargo.toml --target x86_64-unknown-linux-gnu --lib
      - name: Check HID class driver
        run: cargo check --manifest-path drivers/hidclass/Cargo.toml --lib
      - name: Test HID top-level collection parser
        run: cargo test --manifest-path drivers/hidclass/Cargo.toml --target x86_64-unknown-linux-gnu --lib
      - name: Check HID keyboard mapper
        run: cargo check --manifest-path drivers/kbdhid/Cargo.toml --lib
      - name: Test HID keyboard report transitions
        run: cargo test --manifest-path drivers/kbdhid/Cargo.toml --target x86_64-unknown-linux-gnu --lib
      - name: Check PS/2 i8042 port driver
        run: cargo check --manifest-path drivers/i8042prt/Cargo.toml --lib
      - name: Test PS/2 scan-code and bounded polling
        run: cargo test --manifest-path drivers/i8042prt/Cargo.toml --target x86_64-unknown-linux-gnu --lib
      - name: Test PS/2 keyboard input across simulated D0 suspend/resume
        run: cargo test --manifest-path drivers/i8042prt/Cargo.toml --target x86_64-unknown-linux-gnu --lib power_lifecycle_tests
      - name: Check USB xHCI controller core
        run: cargo check --manifest-path drivers/usbxhci/Cargo.toml --lib
      - name: Test USB xHCI capability, rings, DMA and controller startup
        run: cargo test --manifest-path drivers/usbxhci/Cargo.toml --target x86_64-unknown-linux-gnu --lib
      - name: Check separate USB 3 hub policy library
        run: cargo check --manifest-path drivers/usbhub3/Cargo.toml --lib
      - name: Test USB hub descriptors, port lifecycle and stale-completion generation
        run: cargo test --manifest-path drivers/usbhub3/Cargo.toml --target x86_64-unknown-linux-gnu --lib
      - name: Test USB xHCI port power-state transitions
        run: cargo test --manifest-path drivers/usbxhci/Cargo.toml --target x86_64-unknown-linux-gnu --lib power_state_tests
      - name: Test USB xHCI controller D0 exit and entry
        run: cargo test --manifest-path drivers/usbxhci/Cargo.toml --target x86_64-unknown-linux-gnu --lib controller_power_tests
      - name: Test ordered USB device-hub-controller wait-wake propagation
        run: cargo test --manifest-path drivers/usbxhci/Cargo.toml --target x86_64-unknown-linux-gnu --lib usb_wake_chain_tests
      - name: Test ext4 parser and extent mapping
        run: cargo test --manifest-path drivers/ext4/Cargo.toml --target x86_64-unknown-linux-gnu --lib parser_mapping_and_crc_smoke_tests_pass
      - name: Test ext4 metadata checksum validation
        run: cargo test --manifest-path drivers/ext4/Cargo.toml --target x86_64-unknown-linux-gnu --lib metadata_csum_superblock_is_checked_and_corruption_rejected
      - name: Test ext4 writes reject requests beyond EOF
        run: cargo test --manifest-path drivers/ext4/Cargo.toml --target x86_64-unknown-linux-gnu --lib writes_past_inode_eof_are_rejected_before_device_io
      - name: Test ext4 in-place writes preserve untouched bytes
        run: cargo test --manifest-path drivers/ext4/Cargo.toml --target x86_64-unknown-linux-gnu --lib writes_existing_extent_data_with_read_modify_write_and_flush
      - name: Build and validate Rust NTDLL crate
        shell: bash
        run: |
          set -euo pipefail
          python3 ntdll/tools/check_export_table.py
          cargo check --manifest-path ntdll/Cargo.toml --all-targets --target x86_64-unknown-linux-gnu
          cargo build --manifest-path ntdll/Cargo.toml --lib --target x86_64-unknown-linux-gnu
      - name: Verify vendored Windows x64 export tables offline
        run: python3 dlls/tools/verify_windows_exports.py
      - name: Check Rust kernel32, kernelbase, and shell32 crates
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path dlls/kernel32/Cargo.toml --all-targets --target x86_64-unknown-linux-gnu
          cargo check --manifest-path dlls/kernelbase/Cargo.toml --all-targets --target x86_64-unknown-linux-gnu
          cargo check --manifest-path dlls/shell32/Cargo.toml --all-targets --target x86_64-unknown-linux-gnu
      - name: Enforce one NTDLL syscall transition path
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'int[[:space:]]+0x82' ntdll/src; then
            echo "NTDLL must not use the legacy DPL3 interrupt-gate syscall path." >&2
            exit 1
          fi
          if grep -RInF 'install_user_gate(0x82' kernel/src; then
            echo "The kernel must not install the obsolete NT syscall interrupt gate." >&2
            exit 1
          fi
          grep -Eq '^NtCreateKey[[:space:]]+0x145[[:space:]]+7$' ntdll/syscalls/x86_64.syscalls
          grep -Fq 'ntdll_syscall_stubs.S' ntdll/src/native/syscall_stubs.rs
          grep -Fq 'syscall' ntdll/build.rs
          test ! -e ntdll/src/native/syscall_x86_64.rs
          if grep -RInF 'syscall_x86_64' ntdll/src; then
            echo "NTDLL must not retain references to the alternate syscall path." >&2
            exit 1
          fi
          echo "NTDLL stubs are generated from the canonical syscall manifest."
      - name: Build Rust NTDLL as a native PE32+ DLL
        shell: bash
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: lld-link
          RUSTFLAGS: "-C debuginfo=2 -C force-frame-pointers=yes -C link-arg=/DEBUG:FULL -C link-arg=/PDB:${{ github.workspace }}/build/ntdll/cognac_ntdll.pdb -C link-arg=/DEF:${{ github.workspace }}/build/ntdll/ntdll-rust.def -C link-arg=/ENTRY:DllMain -C link-arg=/NODEFAULTLIB -C link-arg=/LIBPATH:${{ github.workspace }}/ntdll"
        run: |
          set -euo pipefail
          mkdir -p build/ntdll
          # Export the pinned Windows 11 x64 NTDLL name inventory from the
          # Rust DLL, rather than shipping a small custom Cognac-only subset.
          python3 - <<'PY'
          from pathlib import Path
          import re
          names = []
          for raw in Path("ntdll/exports/windows-11-x64-exports.txt").read_text().splitlines():
              name = raw.strip()
              if not name or name.startswith("#"):
                  continue
              if not re.fullmatch(r"[A-Za-z0-9_]+", name):
                  raise SystemExit(f"invalid NTDLL export name: {name!r}")
              names.append(name)
          if len(names) < 2000 or len(names) != len(set(names)):
              raise SystemExit(f"unexpected Windows NTDLL inventory: {len(names)} unique={len(set(names))}")
          Path("build/ntdll/ntdll-rust.def").write_text("LIBRARY ntdll\nEXPORTS\n" + "".join(f"    {name}\n" for name in names))
          print(f"Generated Rust NTDLL definition with {len(names)} Windows 11 exports")
          PY
          sysroot="$(rustc --print sysroot)"
          mkdir -p "$RUNNER_TEMP/ntdll-linker"
          ln -sf "$sysroot/lib/rustlib/x86_64-unknown-linux-gnu/bin/rust-lld" "$RUNNER_TEMP/ntdll-linker/lld-link"
          test -x "$RUNNER_TEMP/ntdll-linker/lld-link"
          export PATH="$RUNNER_TEMP/ntdll-linker:$PATH"
          # rustc's Windows target adds ntdll.lib by default. The native DLL
          # must not import itself, so satisfy that target-default input with a
          # tiny COFF archive member; native service entry points link in-tree.
          cat > "$RUNNER_TEMP/ntdll-empty.rs" <<'RS'
          #![no_std]
          #[no_mangle]
          pub extern "C" fn cognac_ntdll_empty_archive_member() {}
          RS
          rustc --edition=2021 --target x86_64-pc-windows-msvc --crate-type lib --emit=obj -o "$RUNNER_TEMP/ntdll-empty.obj" "$RUNNER_TEMP/ntdll-empty.rs"
          ar rcs ntdll/ntdll.lib "$RUNNER_TEMP/ntdll-empty.obj"
          trap 'rm -f ntdll/ntdll.lib "$RUNNER_TEMP/ntdll-empty.obj" "$RUNNER_TEMP/ntdll-empty.rs"' EXIT
          cargo build --manifest-path ntdll/Cargo.toml --lib --target x86_64-pc-windows-msvc --release
          dll=target/x86_64-pc-windows-msvc/release/cognac_ntdll.dll
          test -s "$dll"
          file "$dll" | grep -q 'PE32+.*DLL'
          python3 - "$dll" <<'PY'
          import struct, sys
          blob = open(sys.argv[1], "rb").read()
          assert blob[:2] == b"MZ", "Rust NTDLL lacks DOS header"
          pe = struct.unpack_from("<I", blob, 0x3c)[0]
          assert blob[pe:pe+4] == b"PE\0\0", "Rust NTDLL lacks PE signature"
          assert struct.unpack_from("<H", blob, pe+4)[0] == 0x8664, "Rust NTDLL is not AMD64"
          sections = struct.unpack_from("<H", blob, pe+6)[0]
          opt_size = struct.unpack_from("<H", blob, pe+20)[0]
          characteristics = struct.unpack_from("<H", blob, pe+22)[0]
          opt = pe + 24
          assert struct.unpack_from("<H", blob, opt)[0] == 0x20b, "Rust NTDLL is not PE32+"
          assert characteristics & 0x2000, "Rust NTDLL is not marked as a DLL"
          assert opt_size >= 240 and sections > 0, "Rust NTDLL optional header/sections are invalid"
          print(f"Rust NTDLL PE32+ validation passed: {sections} sections")
          PY
      - name: Build Rust kernel32.dll, kernelbase.dll, and shell32.dll as native PE32+ DLLs
        shell: bash
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: lld-link
        run: |
          set -euo pipefail
          sysroot="$(rustc --print sysroot)"
          mkdir -p "$RUNNER_TEMP/cognacos-dll-linker" build/dlls
          ln -sf "$sysroot/lib/rustlib/x86_64-unknown-linux-gnu/bin/rust-lld" "$RUNNER_TEMP/cognacos-dll-linker/lld-link"
          export PATH="$RUNNER_TEMP/cognacos-dll-linker:$PATH"
          cat > "$RUNNER_TEMP/cognacos-dll-empty.rs" <<'RS'
          #![no_std]
          #[no_mangle]
          pub extern "C" fn cognacos_empty_import_library_member() {}
          RS
          rustc --edition=2021 --target x86_64-pc-windows-msvc --crate-type lib --emit=obj -o "$RUNNER_TEMP/cognacos-dll-empty.obj" "$RUNNER_TEMP/cognacos-dll-empty.rs"
          mkdir -p dlls/kernel32 dlls/kernelbase dlls/shell32
          ar rcs dlls/kernel32/kernel32.lib "$RUNNER_TEMP/cognacos-dll-empty.obj"
          ar rcs dlls/kernelbase/kernel32.lib "$RUNNER_TEMP/cognacos-dll-empty.obj"
          ar rcs dlls/kernelbase/ntdll.lib "$RUNNER_TEMP/cognacos-dll-empty.obj"
          ar rcs dlls/shell32/kernel32.lib "$RUNNER_TEMP/cognacos-dll-empty.obj"
          ar rcs dlls/kernel32/ntdll.lib "$RUNNER_TEMP/cognacos-dll-empty.obj"
          ar rcs dlls/shell32/ntdll.lib "$RUNNER_TEMP/cognacos-dll-empty.obj"
          RUSTFLAGS="-C link-arg=/NODEFAULTLIB -C link-arg=/ENTRY:DllMain -C link-arg=/DEF:$GITHUB_WORKSPACE/dlls/kernel32/exports/kernel32-x64.def -C link-arg=/LIBPATH:$GITHUB_WORKSPACE/dlls/kernel32" cargo build --manifest-path dlls/kernel32/Cargo.toml --lib --target x86_64-pc-windows-msvc --release
          RUSTFLAGS="-C link-arg=/NODEFAULTLIB -C link-arg=/ENTRY:DllMain -C link-arg=/DEF:$GITHUB_WORKSPACE/dlls/kernelbase/exports/kernelbase-x64.def -C link-arg=/LIBPATH:$GITHUB_WORKSPACE/dlls/kernelbase" cargo build --manifest-path dlls/kernelbase/Cargo.toml --lib --target x86_64-pc-windows-msvc --release
          cp target/x86_64-pc-windows-msvc/release/kernelbase.dll build/dlls/kernelbase.dll
          RUSTFLAGS="-C link-arg=/NODEFAULTLIB -C link-arg=/ENTRY:DllMain -C link-arg=/DEF:$GITHUB_WORKSPACE/dlls/shell32/exports/shell32-x64.def -C link-arg=/LIBPATH:$GITHUB_WORKSPACE/dlls/shell32" cargo build --manifest-path dlls/shell32/Cargo.toml --lib --target x86_64-pc-windows-msvc --release
          cp target/x86_64-pc-windows-msvc/release/kernel32.dll build/dlls/kernel32.dll
          cp target/x86_64-pc-windows-msvc/release/shell32.dll build/dlls/shell32.dll
          file build/dlls/kernel32.dll | grep -q 'PE32+.*DLL'
          file build/dlls/kernelbase.dll | grep -q 'PE32+.*DLL'
          file build/dlls/shell32.dll | grep -q 'PE32+.*DLL'
          python3 tools/verify_dll_exports.py \
            --dll kernel32,build/dlls/kernel32.dll,dlls/kernel32/exports/windows-11-x64-exports.tsv \
            --dll kernelbase,build/dlls/kernelbase.dll,dlls/kernelbase/exports/windows-11-x64-exports.tsv \
            --dll shell32,build/dlls/shell32.dll,dlls/shell32/exports/windows-11-x64-exports.tsv
          rm -f dlls/kernel32/kernel32.lib dlls/kernel32/ntdll.lib dlls/kernelbase/kernel32.lib dlls/kernelbase/ntdll.lib dlls/shell32/kernel32.lib dlls/shell32/ntdll.lib "$RUNNER_TEMP/cognacos-dll-empty.obj" "$RUNNER_TEMP/cognacos-dll-empty.rs"
      - name: Check native CSR server dispatcher core
        run: cargo check --manifest-path csrss/Cargo.toml --lib --target x86_64-unknown-linux-gnu
      - name: Test native CSR dispatch and client lifecycle
        run: cargo test --manifest-path csrss/Cargo.toml --lib --target x86_64-unknown-linux-gnu
      - name: Test NTOSKRNL structured debug ring and persistence validation
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/cognacos-ntoskrnl-debug-tests.rs <<'RS'
          #![allow(dead_code)]
          mod ata_disk {
              pub fn debug_trace_store_read(_: u64, _: &mut [u8]) -> bool { false }
              pub fn debug_trace_store_write(_: u64, _: &[u8]) -> bool { false }
          }
          mod debug {
              include!(concat!(env!("GITHUB_WORKSPACE"), "/kernel/src/ntoskrnl/debug.rs"));
          }
          RS
          rustc --edition=2024 --test /tmp/cognacos-ntoskrnl-debug-tests.rs -o /tmp/cognacos-ntoskrnl-debug-tests
          /tmp/cognacos-ntoskrnl-debug-tests
      - name: Test interactive debugger command parser
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/cognacos-debug-console-tests.rs <<'RS'
          #![allow(dead_code)]
          pub unsafe fn serial_write(_: &[u8]) {}
          pub unsafe fn serial_write_hex(_: u64) {}
          mod ntoskrnl {
              pub mod debug {
                  pub const TRACE_CAPACITY: usize = 128;
                  pub fn latest_sequence() -> u64 { 0 }
                  pub fn dump_serial(_: usize) {}
                  pub fn set_filter(_: u32, _: u32, _: bool) -> bool { true }
                  pub fn persist_to_storage() -> bool { false }
                  pub fn restore_from_storage() -> bool { false }
              }
          }
          mod debug_console {
              include!(concat!(env!("GITHUB_WORKSPACE"), "/kernel/src/ntoskrnl/debug_console.rs"));
          }
          RS
          rustc --edition=2024 --test /tmp/cognacos-debug-console-tests.rs -o /tmp/cognacos-debug-console-tests
          /tmp/cognacos-debug-console-tests
      - name: Test legacy kernel diagnostic trace publication and wraparound
        run: |
          set -euo pipefail
          rustc --edition=2024 --test kernel/src/ntoskrnl/ke/diagnostics.rs -o /tmp/cognacos-kernel-diagnostics-tests
          /tmp/cognacos-kernel-diagnostics-tests
      - name: Test bounded ALPC transport core
        run: |
          set -euo pipefail
          rustc --edition=2024 --test kernel/src/ntoskrnl/alpc.rs -o /tmp/cognacos-alpc-tests
          /tmp/cognacos-alpc-tests
      - name: Test ALPC section/security/completion resource core
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2024 --test kernel/src/ntoskrnl/alpc_resources.rs -o /tmp/cognacos-alpc-resource-tests
          /tmp/cognacos-alpc-resource-tests
      - name: Validate CSRSRV export contract inventory
        run: python3 tools/check_csrsrv_exports.py
      - name: Build separate native PE32+ HAL and driver images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/drivers
          build_driver() {
            local name="$1" package="$2" bin="$3" base="$4" output="$5"
            local code_model_flags=""
            if [[ "$name" == "usbxhci" ]]; then code_model_flags="-C code-model=large"; fi
            RUSTFLAGS="-C debuginfo=2 -C force-frame-pointers=yes -C relocation-model=static $code_model_flags -C link-arg=-T$GITHUB_WORKSPACE/$package/driver.ld" \
              cargo build --manifest-path "$package/Cargo.toml" --target x86_64-unknown-none \
                --target-dir "target/driver-$name" --release --bin "$bin"
            python3 tools/elf_to_pe32plus.py "target/driver-$name/x86_64-unknown-none/release/$bin" \
              "build/drivers/$output" --image-base "$base" --dll
          }
          build_driver hal drivers/hal hal 0xffff8000c0000000 Hal.dll
          build_driver acpi drivers/acpi acpi 0xffff8000d0000000 acpi.sys
          build_driver pci drivers/pci pci 0xffff8000e0000000 pci.sys
          build_driver processor drivers/processor processor 0xffff8000f0000000 processor.sys
          build_driver hidclass drivers/hidclass hidclass 0xffff800170000000 hidclass.sys
          build_driver kbdclass drivers/kbdclass kbdclass 0xffff800140000000 kbdclass.sys
          build_driver kbdhid drivers/kbdhid kbdhid 0xffff800150000000 kbdhid.sys
          build_driver i8042prt drivers/i8042prt i8042prt 0xffff800160000000 i8042prt.sys
          build_driver usbxhci drivers/usbxhci usbxhci 0xffff800180000000 usbxhci.sys
          RUSTFLAGS="-C debuginfo=2 -C force-frame-pointers=yes -C relocation-model=static -C link-arg=-T$GITHUB_WORKSPACE/drivers/storage/storahci.ld" cargo build --manifest-path drivers/storage/Cargo.toml --target x86_64-unknown-none --target-dir target/driver-storahci --release --bin storahci
          python3 tools/elf_to_pe32plus.py target/driver-storahci/x86_64-unknown-none/release/storahci build/drivers/storahci.sys --image-base 0xffff800110000000 --dll
          RUSTFLAGS="-C debuginfo=2 -C force-frame-pointers=yes -C relocation-model=static -C link-arg=-T$GITHUB_WORKSPACE/drivers/storage/stornvme.ld" cargo build --manifest-path drivers/storage/Cargo.toml --target x86_64-unknown-none --target-dir target/driver-stornvme --release --bin stornvme
          python3 tools/elf_to_pe32plus.py target/driver-stornvme/x86_64-unknown-none/release/stornvme build/drivers/stornvme.sys --image-base 0xffff800120000000 --dll
          RUSTFLAGS="-C debuginfo=2 -C force-frame-pointers=yes -C relocation-model=static -C link-arg=-T$GITHUB_WORKSPACE/drivers/storage/disk.ld" cargo build --manifest-path drivers/storage/Cargo.toml --target x86_64-unknown-none --target-dir target/driver-disk --release --bin disk
          python3 tools/elf_to_pe32plus.py target/driver-disk/x86_64-unknown-none/release/disk build/drivers/disk.sys --image-base 0xffff800130000000 --dll
          python3 - <<'PY'
          import struct
          from pathlib import Path
          for path in sorted(Path("build/drivers").iterdir()):
              p = path.read_bytes()
              assert p[:2] == b"MZ", f"{path}: missing MZ"
              pe = struct.unpack_from("<I", p, 0x3c)[0]
              assert p[pe:pe+4] == b"PE\0\0", f"{path}: missing PE"
              assert struct.unpack_from("<H", p, pe+4)[0] == 0x8664, f"{path}: wrong machine"
              assert struct.unpack_from("<H", p, pe+22)[0] & 0x2000, f"{path}: not a DLL image"
              opt = pe + 24
              assert struct.unpack_from("<H", p, opt)[0] == 0x20b, f"{path}: not PE32+"
              assert struct.unpack_from("<H", p, opt+68)[0] == 1, f"{path}: not native subsystem"
              assert struct.unpack_from("<I", p, opt+16)[0] != 0, f"{path}: no entry point"
              assert struct.unpack_from("<II", p, opt+112+8) == (0, 0), f"{path}: imports unsupported by stage-1 loader"
              assert struct.unpack_from("<II", p, opt+112+5*8) == (0, 0), f"{path}: relocations unsupported by stage-1 loader"
              print(f"validated native PE32+ driver: {path} ({len(p)} bytes)")
          PY
      - name: Test XSTATE source contracts
