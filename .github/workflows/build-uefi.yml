name: Build and boot-test RdotOS Rust UEFI kernel

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rust-os:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - name: Enforce HAL/ntoskrnl dependency boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE 'crate::ntoskrnl|crate::acpi::' kernel/src/hal.rs kernel/src/hal/apic.rs; then
            echo "HAL implementation must not depend on ntoskrnl or ACPI parsing types." >&2
            exit 1
          fi
          if grep -RIn 'crate::apic' kernel/src --include='*.rs' || grep -RIn 'use crate::{[^}]*apic' kernel/src --include='*.rs'; then
            echo "APIC implementation must only be reached through HAL service contracts." >&2
            exit 1
          fi
          test ! -e kernel/src/acpi.rs
          test ! -e kernel/src/pci.rs
          grep -q "^#!\[no_std\]" drivers/acpi/src/lib.rs
          grep -q "^#!\[no_std\]" drivers/pci/src/lib.rs
          echo "HAL and independent driver source-boundary checks passed."
      - name: Test independent platform and driver crates
        run: |
          set -euo pipefail
          cargo test --manifest-path drivers/hal/Cargo.toml
          cargo test --manifest-path drivers/acpi/Cargo.toml
          cargo test --manifest-path drivers/pci/Cargo.toml
          cargo test --manifest-path drivers/processor/Cargo.toml
      - name: Install Rust targets
        run: |
          rustup update stable
          rustup target add x86_64-unknown-uefi x86_64-unknown-none
      - name: Build separate native PE32+ HAL and driver images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/drivers
          build_driver() {
            local name="$1" package="$2" bin="$3" base="$4" output="$5"
            RUSTFLAGS="-C relocation-model=static -C link-arg=-T$GITHUB_WORKSPACE/$package/driver.ld" \\
              cargo build --manifest-path "$package/Cargo.toml" --target x86_64-unknown-none \\
                --target-dir "target/driver-$name" --release --bin "$bin"
            python3 tools/elf_to_pe32plus.py "target/driver-$name/x86_64-unknown-none/release/$bin" \\
              "build/drivers/$output" --image-base "$base" --dll
          }
          build_driver hal drivers/hal hal 0xffff8000c0000000 Hal.dll
          build_driver acpi drivers/acpi acpi 0xffff8000d0000000 acpi.sys
          build_driver pci drivers/pci pci 0xffff8000e0000000 pci.sys
          build_driver processor drivers/processor processor 0xffff8000f0000000 processor.sys
          python3 - <<'PY'
          import struct
          from pathlib import Path
          for path in sorted(Path("build/drivers").iterdir()):
              p = path.read_bytes()
              assert p[:2] == b"MZ", f"{path}: missing MZ"
              pe = struct.unpack_from("<I", p, 0x3c)[0]
              assert p[pe:pe+4] == b"PE\0\0", f"{path}: missing PE"
              assert struct.unpack_from("<H", p, pe+4)[0] == 0x8664, f"{path}: wrong machine"
              assert struct.unpack_from("<H", p, pe+22)[0] & 0x2000, f"{path}: not a DLL image"
              opt = pe + 24
              assert struct.unpack_from("<H", p, opt)[0] == 0x20b, f"{path}: not PE32+"
              assert struct.unpack_from("<H", p, opt+68)[0] == 1, f"{path}: not native subsystem"
              assert struct.unpack_from("<I", p, opt+16)[0] != 0, f"{path}: no entry point"
              assert struct.unpack_from("<II", p, opt+112+8) == (0, 0), f"{path}: imports unsupported by stage-1 loader"
              assert struct.unpack_from("<II", p, opt+112+5*8) == (0, 0), f"{path}: relocations unsupported by stage-1 loader"
              print(f"validated native PE32+ driver: {path} ({len(p)} bytes)")
          PY
      - name: Run host-side physical allocator map tests
        run: |
          mkdir -p build
          rustc --edition=2021 --test kernel/src/memory.rs -o build/memory-tests
          build/memory-tests
      - name: Run host-side ext filesystem parser tests
        run: |
          mkdir -p build
          rustc --edition=2021 --test kernel/src/extfs.rs -o build/extfs-tests
          build/extfs-tests
      - name: Run host-side Ke timer-generation regression tests
        run: |
          mkdir -p build
          rustc --edition=2021 --test kernel/src/ntoskrnl/ke/timer_generation.rs -o build/ke-timer-generation-tests
          build/ke-timer-generation-tests
      - name: Run host-side registry runtime tests
        run: |
          set -euo pipefail
          mkdir -p build
          rustc --edition=2024 --test kernel/src/ntoskrnl/cm/runtime.rs -o build/registry-tests
          build/registry-tests
      - name: Build freestanding Rust kernel with project linker script
        env:
          RUSTFLAGS: -C relocation-model=static -C link-arg=-T${{ github.workspace }}/kernel/linker.ld
        run: cargo build --manifest-path kernel/Cargo.toml --target x86_64-unknown-none --release
      - name: Convert fixed-base kernel ELF to PE32+
        run: |
          python3 tools/elf_to_pe32plus.py target/x86_64-unknown-none/release/rdotos-kernel build/rdotos-kernel.exe
          file build/rdotos-kernel.exe
          python3 - <<'PY'
          import struct
          p = open("build/rdotos-kernel.exe", "rb").read()
          assert p[:2] == b"MZ", "missing DOS MZ signature"
          off = struct.unpack_from("<I", p, 0x3c)[0]
          assert p[off:off+4] == b"PE\0\0", "missing PE signature"
          assert struct.unpack_from("<H", p, off+4)[0] == 0x8664, "not AMD64"
          assert struct.unpack_from("<H", p, off+24)[0] == 0x20b, "not PE32+"
          sections = struct.unpack_from("<H", p, off+6)[0]
          opt = off + 24
          assert struct.unpack_from("<Q", p, opt+24)[0] == 0xffffffff7fe00000, "unexpected kernel image base"
          assert struct.unpack_from("<H", p, opt+68)[0] == 1, "kernel must use native subsystem"
          assert struct.unpack_from("<II", p, opt+112+8) == (0, 0), "kernel imports are unsupported"
          assert struct.unpack_from("<II", p, opt+112+5*8) == (0, 0), "kernel relocations are unsupported"
          table = opt + struct.unpack_from("<H", p, off+20)[0]
          assert all(struct.unpack_from("<I", p, table+i*40+12)[0] >= 0x1000 for i in range(sections)), "invalid section RVA"
          print(f"PE32+ native kernel header validation passed: {sections} sections")
          PY
      - name: Pin PE32+ kernel digest into Rust bootloader trust anchor
        id: kernel-digest
        shell: bash
        run: |
          digest="$(sha256sum build/rdotos-kernel.exe | cut -d' ' -f1)"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
      - name: Build Rust UEFI bootloader with pinned kernel digest
        env:
          RDOTOS_KERNEL_SHA256: ${{ steps.kernel-digest.outputs.sha256 }}
        run: cargo build --manifest-path bootloader/Cargo.toml --target x86_64-unknown-uefi --release
      - name: Validate source ELF and PE32+ kernel image
        run: |
          file target/x86_64-unknown-none/release/rdotos-kernel build/rdotos-kernel.exe
          readelf -h target/x86_64-unknown-none/release/rdotos-kernel | grep -qE 'Class:.*ELF64'
          readelf -h target/x86_64-unknown-none/release/rdotos-kernel | grep -qE 'Machine:.*X86-64'
          readelf -h target/x86_64-unknown-none/release/rdotos-kernel | grep -qE 'Type:.*EXEC'
          file build/rdotos-kernel.exe | grep -q 'PE32+'
      - name: Package a GPT EFI System Partition image
        run: |
          sudo apt-get update
          sudo apt-get install -y dosfstools mtools parted qemu-system-x86 ovmf
          mkdir -p build/EFI/BOOT build/kernel
          cp target/x86_64-unknown-uefi/release/rdotos-bootloader.efi build/EFI/BOOT/BOOTX64.EFI
          cp build/rdotos-kernel.exe build/EFI/BOOT/rdotos-kernel.exe
          cp build/rdotos-kernel.exe build/kernel/rdotos-kernel.exe
          truncate -s 256M build/rdotos-uefi.img
          truncate -s 128M build/pagefile.img
          parted -s build/rdotos-uefi.img mklabel gpt
          parted -s build/rdotos-uefi.img mkpart ESP fat32 1MiB 100%
          parted -s build/rdotos-uefi.img set 1 esp on
          mformat -i build/rdotos-uefi.img@@1048576 -F ::
          mmd -i build/rdotos-uefi.img@@1048576 ::/EFI
          mmd -i build/rdotos-uefi.img@@1048576 ::/EFI/BOOT
          mcopy -i build/rdotos-uefi.img@@1048576 build/EFI/BOOT/BOOTX64.EFI ::/EFI/BOOT/BOOTX64.EFI
          mcopy -i build/rdotos-uefi.img@@1048576 build/EFI/BOOT/rdotos-kernel.exe ::/EFI/BOOT/rdotos-kernel.exe
      - name: Boot smoke test under OVMF/QEMU
        shell: bash
        run: |
          set -euo pipefail
          # Select a matching CODE/VARS pair: mixing 2 MiB and 4 MiB
          # firmware images can make QEMU fail before the boot test starts.
          if [ -f /usr/share/OVMF/OVMF_CODE_4M.fd ] && [ -f /usr/share/OVMF/OVMF_VARS_4M.fd ]; then
            code=/usr/share/OVMF/OVMF_CODE_4M.fd
            vars_template=/usr/share/OVMF/OVMF_VARS_4M.fd
          elif [ -f /usr/share/OVMF/OVMF_CODE.fd ] && [ -f /usr/share/OVMF/OVMF_VARS.fd ]; then
            code=/usr/share/OVMF/OVMF_CODE.fd
            vars_template=/usr/share/OVMF/OVMF_VARS.fd
          else
            echo "No matching OVMF CODE/VARS firmware pair found" >&2
            find /usr/share/OVMF -maxdepth 1 -type f -print
            exit 1
          fi
          cp "$vars_template" build/OVMF_VARS.fd
          rm -f build/serial.log
          set +e
          timeout 30s qemu-system-x86_64 \
            -machine pc -m 5G -cpu qemu64 -smp 4 \
            -drive if=pflash,format=raw,readonly=on,file="$code" \
            -drive if=pflash,format=raw,file=build/OVMF_VARS.fd \
            -drive if=ide,format=raw,file=build/rdotos-uefi.img \
            -drive if=ide,format=raw,index=1,file=build/pagefile.img \
            -boot order=c -display none -monitor none \
            -serial file:build/serial.log -no-reboot -no-shutdown
          qemu_status=$?
          set -e
          # The kernel intentionally halts with interrupts disabled, so timeout
          # is expected after a successful handoff. Other QEMU failures are fatal.
          if [ "$qemu_status" -ne 124 ] && [ "$qemu_status" -ne 0 ]; then
            echo "QEMU exited unexpectedly with status $qemu_status" >&2
            cat build/serial.log || true
            exit "$qemu_status"
          fi
          if [ ! -f build/serial.log ]; then
            echo "QEMU did not create the serial log" >&2
            exit 1
          fi
          cat build/serial.log
          grep -F 'RdotOS Rust kernel entered.' build/serial.log
          grep -F 'Kernel-owned CR3 activated successfully.' build/serial.log
          grep -F 'Page-table inspection passed: high-half kernel sections, stack alias, low boot data, and guard pages validated.' build/serial.log
          grep -F 'High-RAM allocator and direct-map self-test passed.' build/serial.log
          grep -F 'NT memory manager: physical translation, validity, and checked-copy self-test passed.' build/serial.log
          grep -F 'Physical allocator initialized' build/serial.log
          grep -F 'Pagefile storage initialized on dedicated ATA primary-slave disk; slots:' build/serial.log
          grep -F 'Pagefile storage read/write self-test passed.' build/serial.log
          grep -F 'Pagefile-backed pageable eviction and fault-driven page-in self-test passed.' build/serial.log
          grep -F 'HAL CPU-local registry, MMIO bounds, and x86-64 primitives initialized.' build/serial.log
          grep -F 'SMP startup target validation passed.' build/serial.log
          grep -E 'SMP AP startup complete; online application processors: [1-9][0-9]*' build/serial.log
          grep -F 'Firmware ACPI MADT validated; enabled APs discovered:' build/serial.log
          grep -F 'I/O manager cancellation, in-flight ownership, and asynchronous completion tests passed.' build/serial.log
          grep -F 'Security: CR0.WP enabled' build/serial.log
          grep -F 'Security: NX enabled; strict page policy follows' build/serial.log
          grep -F 'Security: 4 KiB page policy active; W^X enforced for kernel sections.' build/serial.log
          grep -F 'Security: kernel stack guard page unmapped.' build/serial.log
          grep -F 'Protection self-tests passed: read-only write trapped and NX execution trapped.' build/serial.log
          grep -F 'Process address-space and checked user-copy self-test passed.' build/serial.log
          grep -F 'Security: ring-3 GDT/TSS RSP0 installed; IRETQ transition available.' build/serial.log
          grep -F 'PE32+ loader self-test passed; image base=0x0000200000000000 entry=0x0000200000001000 (RX section and RO/NX headers).' build/serial.log
          grep -F 'PE fixture: DLL export registration passed.' build/serial.log
          grep -F 'PE fixture: normal import binding passed.' build/serial.log
          grep -F 'PE fixture: delay import binding passed.' build/serial.log
          grep -F 'Windows API-set resolution and PE TLS/unwind registration passed.' build/serial.log
          grep -F 'PE TLS callbacks executed in ring 3; per-image TLS blocks initialized.' build/serial.log
          grep -F 'Ext filesystem parser self-test passed (read-only ext2/ext3/ext4 metadata; unsupported features rejected).' build/serial.log
          grep -F 'Ring-3 syscall dispatch, process exit, and PEB/TEB setup passed.' build/serial.log
      - name: SMP boot and interrupt stress matrix (2, 4, 8 vCPUs)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /usr/share/OVMF/OVMF_CODE_4M.fd ] && [ -f /usr/share/OVMF/OVMF_VARS_4M.fd ]; then
            code=/usr/share/OVMF/OVMF_CODE_4M.fd
            vars_template=/usr/share/OVMF/OVMF_VARS_4M.fd
          else
            code=/usr/share/OVMF/OVMF_CODE.fd
            vars_template=/usr/share/OVMF/OVMF_VARS.fd
          fi
          for cpus in 2 4 8; do
            echo "=== SMP stress boot: $cpus vCPUs ==="
            cp "$vars_template" "build/OVMF_VARS_smp_$cpus.fd"
            log="build/serial-smp-$cpus.log"
            rm -f "$log"
            set +e
            timeout 22s qemu-system-x86_64 \
              -machine pc -m 5G -cpu qemu64 -smp "$cpus" \
              -drive if=pflash,format=raw,readonly=on,file="$code" \
              -drive if=pflash,format=raw,file="build/OVMF_VARS_smp_$cpus.fd" \
              -drive if=ide,format=raw,file=build/rdotos-uefi.img \
              -drive if=ide,format=raw,index=1,file=build/pagefile.img \
              -boot order=c -display none -monitor none \
              -serial "file:$log" -no-reboot -no-shutdown
            status=$?
            set -e
            if [ "$status" -ne 124 ] && [ "$status" -ne 0 ]; then
              echo "QEMU SMP stress boot failed (vCPUs=$cpus, status=$status)" >&2
              cat "$log" || true
              exit "$status"
            fi
            cat "$log"
            expected_aps=$((cpus - 1))
            grep -F "SMP AP startup complete; online application processors: $expected_aps; interrupt-driven TLB shootdowns enabled." "$log"
            grep -F "Per-CPU TSS/IST setup self-test passed." "$log"
            grep -F "Per-CPU interrupt setup stress passed: 64 acknowledged IPIs per online AP." "$log"
            grep -F "SMP scheduler, cross-CPU wakeup, contended-lock, IRP/object teardown stress passed." "$log"
            grep -F "Kernel VM extent stress and SMP TLB shootdown self-test passed." "$log"
          done
      - name: Upload Rust artifacts and boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdotos-rust-uefi-kernel
          path: |
            build/EFI/BOOT/BOOTX64.EFI
            build/kernel/rdotos-kernel.exe
            build/rdotos-uefi.img
            build/serial.log
            build/serial-smp-*.log
            build/drivers/Hal.dll
            build/drivers/acpi.sys
            build/drivers/pci.sys
            build/drivers/processor.sys
