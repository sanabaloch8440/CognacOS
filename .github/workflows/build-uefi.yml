          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
      - name: Sign PE32+ kernel and prepare verification key
        id: kernel-sign
        shell: bash
        env:
          COGNACOS_SIGNING_PRIVATE_KEY: ${{ secrets.COGNACOS_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p build
          if [[ -n "${COGNACOS_SIGNING_PRIVATE_KEY:-}" ]]; then
            printf '%s' "$COGNACOS_SIGNING_PRIVATE_KEY" > build/cognacos-kernel-signing.pem
            echo "Using repository-configured CognacOS signing key."
          else
            openssl genpkey -algorithm ED25519 -out build/cognacos-kernel-signing.pem
            echo "No release signing secret configured; using an ephemeral CI-only key."
          fi
          openssl pkey -in build/cognacos-kernel-signing.pem -pubout -outform DER -out build/cognacos-kernel-public.der
          openssl pkeyutl -sign -rawin -inkey build/cognacos-kernel-signing.pem -in build/cognacos-kernel.exe -out build/cognacos-kernel.sig
          public_key="$(tail -c 32 build/cognacos-kernel-public.der | xxd -p -c 64)"
          signature="$(xxd -p -c 128 build/cognacos-kernel.sig)"
          test "${#public_key}" -eq 64
          test "${#signature}" -eq 128
          openssl pkeyutl -verify -rawin -pubin -keyform DER -inkey build/cognacos-kernel-public.der -in build/cognacos-kernel.exe -sigfile build/cognacos-kernel.sig
          cp build/cognacos-kernel.exe build/cognacos-kernel-tampered.exe
          python3 - <<'PY'
          p = "build/cognacos-kernel-tampered.exe"
          with open(p, "r+b") as f:
              b = f.read(1)
              assert b
              f.seek(0)
              f.write(bytes([b[0] ^ 1]))
          PY
          if openssl pkeyutl -verify -rawin -pubin -keyform DER -inkey build/cognacos-kernel-public.der -in build/cognacos-kernel-tampered.exe -sigfile build/cognacos-kernel.sig >/dev/null 2>&1; then
            echo "Tampered kernel incorrectly passed signature verification." >&2
            exit 1
          fi
          rm -f build/cognacos-kernel-tampered.exe
          echo "Valid signature accepted and tampered kernel rejected."
          echo "public_key=$public_key" >> "$GITHUB_OUTPUT"
          echo "signature=$signature" >> "$GITHUB_OUTPUT"
          rm -f build/cognacos-kernel-signing.pem
      - name: Build Rust UEFI bootloader with pinned kernel trust anchors
