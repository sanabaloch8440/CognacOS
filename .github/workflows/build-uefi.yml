name: Build and boot-test CognacOS Rust UEFI kernel

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'assets/**'
      - '_config.yml'
      - 'index.html'
      - 'Gemfile'
      - 'Gemfile.lock'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'assets/**'
      - '_config.yml'
      - 'index.html'
      - 'Gemfile'
      - 'Gemfile.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rust-os:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      # Keep DWARF line tables and frame pointers in the ELF symbol companions
      # used by GDB. PE artifacts remain the actual boot/runtime images.
      CARGO_PROFILE_RELEASE_DEBUG: "2"
      CARGO_PROFILE_RELEASE_STRIP: "none"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust targets
        run: |
          rustup update stable
          rustup target add x86_64-unknown-uefi x86_64-unknown-none x86_64-pc-windows-msvc
      - name: Ensure third-party filesystem sources are absent
        shell: bash
        run: |
          set -euo pipefail
          if git ls-tree HEAD third_party/Ext3Fsd | grep -q .; then
            echo "Third-party filesystem driver gitlink must not be present in the source tree." >&2
            exit 1
          fi
          test ! -e third_party/Ext3Fsd
          test ! -e third_party/README.md
      - name: Reject HAL dependencies on NTOSKRNL and ACPI
        shell: bash
        run: |
          set -euo pipefail
          if grep -nF -e 'crate::ntoskrnl' -e 'crate::acpi::' kernel/src/hal.rs kernel/src/hal/apic.rs; then
            echo "HAL implementation must not depend on ntoskrnl or ACPI parsing types." >&2
            exit 1
          fi
      - name: Reject obsolete root APIC references
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInF 'crate::apic' kernel/src --include='*.rs' || grep -RInE 'use crate::\{[^}]*apic' kernel/src --include='*.rs'; then
            echo "APIC implementation must only be reached through HAL service contracts." >&2
            exit 1
          fi
      - name: Verify independent platform driver boundaries
        shell: bash
        run: |
          set -euo pipefail
          test ! -e kernel/src/acpi.rs
          test ! -e kernel/src/pci.rs
          grep -Fq '#![no_std]' drivers/acpi/src/lib.rs
          grep -Fq '#![no_std]' drivers/pci/src/lib.rs
          echo "HAL and independent driver source-boundary checks passed."
      - name: Check HAL contract library
        run: cargo check --manifest-path drivers/hal/Cargo.toml --lib
      - name: Check ACPI driver library
        run: cargo check --manifest-path drivers/acpi/Cargo.toml --lib
      - name: Check PCI driver library
        run: cargo check --manifest-path drivers/pci/Cargo.toml --lib
      - name: Check processor driver library
        run: cargo check --manifest-path drivers/processor/Cargo.toml --lib
      - name: Check ext4 driver library
        run: cargo check --manifest-path drivers/ext4/Cargo.toml --lib
      - name: Check storage stack library
        run: cargo check --manifest-path drivers/storage/Cargo.toml --lib
      - name: Test storage protocol and disk-class primitives
        run: cargo test --manifest-path drivers/storage/Cargo.toml --target x86_64-unknown-linux-gnu --lib
      - name: Test ext4 parser and extent mapping
        run: cargo test --manifest-path drivers/ext4/Cargo.toml --target x86_64-unknown-linux-gnu --lib parser_mapping_and_crc_smoke_tests_pass
      - name: Test ext4 metadata checksum validation
        run: cargo test --manifest-path drivers/ext4/Cargo.toml --target x86_64-unknown-linux-gnu --lib metadata_csum_superblock_is_checked_and_corruption_rejected
      - name: Test ext4 writes reject requests beyond EOF
        run: cargo test --manifest-path drivers/ext4/Cargo.toml --target x86_64-unknown-linux-gnu --lib writes_past_inode_eof_are_rejected_before_device_io
      - name: Build and validate Rust NTDLL crate
        shell: bash
        run: |
          set -euo pipefail
          python3 ntdll/tools/check_export_table.py
          cargo check --manifest-path ntdll/Cargo.toml --all-targets --target x86_64-unknown-linux-gnu
          cargo build --manifest-path ntdll/Cargo.toml --lib --target x86_64-unknown-linux-gnu
      - name: Build Rust NTDLL as a native PE32+ DLL
        shell: bash
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: lld-link
          RUSTFLAGS: "-C debuginfo=2 -C force-frame-pointers=yes -C link-arg=/DEBUG:FULL -C link-arg=/PDB:${{ github.workspace }}/build/ntdll/cognac_ntdll.pdb -C link-arg=/DEF:${{ github.workspace }}/build/ntdll/ntdll-rust.def -C link-arg=/ENTRY:DllMain -C link-arg=/NODEFAULTLIB -C link-arg=/LIBPATH:${{ github.workspace }}/ntdll"
        run: |
          set -euo pipefail
          mkdir -p build/ntdll
          # Export the pinned Windows 11 x64 NTDLL name inventory from the
          # Rust DLL, rather than shipping a small custom Cognac-only subset.
          python3 - <<'PY'
          from pathlib import Path
          import re
          names = []
          for raw in Path("ntdll/exports/windows-11-x64-exports.txt").read_text().splitlines():
              name = raw.strip()
              if not name or name.startswith("#"):
                  continue
              if not re.fullmatch(r"[A-Za-z0-9_]+", name):
                  raise SystemExit(f"invalid NTDLL export name: {name!r}")
              names.append(name)
          if len(names) < 2000 or len(names) != len(set(names)):
              raise SystemExit(f"unexpected Windows NTDLL inventory: {len(names)} unique={len(set(names))}")
          Path("build/ntdll/ntdll-rust.def").write_text("LIBRARY ntdll\\nEXPORTS\\n" + "".join(f"    {name}\\n" for name in names))
          print(f"Generated Rust NTDLL definition with {len(names)} Windows 11 exports")
          PY
          sysroot="$(rustc --print sysroot)"
          mkdir -p "$RUNNER_TEMP/ntdll-linker"
          ln -sf "$sysroot/lib/rustlib/x86_64-unknown-linux-gnu/bin/rust-lld" "$RUNNER_TEMP/ntdll-linker/lld-link"
          test -x "$RUNNER_TEMP/ntdll-linker/lld-link"
          export PATH="$RUNNER_TEMP/ntdll-linker:$PATH"
          # rustc's Windows target adds ntdll.lib by default. The native DLL
          # must not import itself, so satisfy that target-default input with a
          # tiny COFF archive member; native service entry points link in-tree.
          cat > "$RUNNER_TEMP/ntdll-empty.rs" <<'RS'
          #![no_std]
          #[no_mangle]
          pub extern "C" fn cognac_ntdll_empty_archive_member() {}
          RS
          rustc --edition=2021 --target x86_64-pc-windows-msvc --crate-type lib --emit=obj -o "$RUNNER_TEMP/ntdll-empty.obj" "$RUNNER_TEMP/ntdll-empty.rs"
          ar rcs ntdll/ntdll.lib "$RUNNER_TEMP/ntdll-empty.obj"
          trap 'rm -f ntdll/ntdll.lib "$RUNNER_TEMP/ntdll-empty.obj" "$RUNNER_TEMP/ntdll-empty.rs"' EXIT
          cargo build --manifest-path ntdll/Cargo.toml --lib --target x86_64-pc-windows-msvc --release
          dll=target/x86_64-pc-windows-msvc/release/cognac_ntdll.dll
          test -s "$dll"
          file "$dll" | grep -q 'PE32+.*DLL'
          python3 - "$dll" <<'PY'
          import struct, sys
          blob = open(sys.argv[1], "rb").read()
          assert blob[:2] == b"MZ", "Rust NTDLL lacks DOS header"
          pe = struct.unpack_from("<I", blob, 0x3c)[0]
          assert blob[pe:pe+4] == b"PE\0\0", "Rust NTDLL lacks PE signature"
          assert struct.unpack_from("<H", blob, pe+4)[0] == 0x8664, "Rust NTDLL is not AMD64"
          sections = struct.unpack_from("<H", blob, pe+6)[0]
          opt_size = struct.unpack_from("<H", blob, pe+20)[0]
          characteristics = struct.unpack_from("<H", blob, pe+22)[0]
          opt = pe + 24
          assert struct.unpack_from("<H", blob, opt)[0] == 0x20b, "Rust NTDLL is not PE32+"
          assert characteristics & 0x2000, "Rust NTDLL is not marked as a DLL"
          assert opt_size >= 240 and sections > 0, "Rust NTDLL optional header/sections are invalid"
          print(f"Rust NTDLL PE32+ validation passed: {sections} sections")
          PY
      - name: Check native CSR server dispatcher core
        run: cargo check --manifest-path csrss/Cargo.toml --lib --target x86_64-unknown-linux-gnu
      - name: Test native CSR dispatch and client lifecycle
        run: cargo test --manifest-path csrss/Cargo.toml --lib --target x86_64-unknown-linux-gnu
      - name: Test bounded ALPC transport core
        run: |
          set -euo pipefail
          rustc --edition=2024 --test kernel/src/ntoskrnl/alpc.rs -o /tmp/cognacos-alpc-tests
          /tmp/cognacos-alpc-tests
      - name: Test ALPC section/security/completion resource core
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2024 --test kernel/src/ntoskrnl/alpc_resources.rs -o /tmp/cognacos-alpc-resource-tests
          /tmp/cognacos-alpc-resource-tests
      - name: Validate CSRSRV export contract inventory
        run: python3 tools/check_csrsrv_exports.py
      - name: Build separate native PE32+ HAL and driver images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/drivers
          build_driver() {
            local name="$1" package="$2" bin="$3" base="$4" output="$5"
            RUSTFLAGS="-C debuginfo=2 -C force-frame-pointers=yes -C relocation-model=static -C link-arg=-T$GITHUB_WORKSPACE/$package/driver.ld" \
              cargo build --manifest-path "$package/Cargo.toml" --target x86_64-unknown-none \
                --target-dir "target/driver-$name" --release --bin "$bin"
            python3 tools/elf_to_pe32plus.py "target/driver-$name/x86_64-unknown-none/release/$bin" \
              "build/drivers/$output" --image-base "$base" --dll
          }
          build_driver hal drivers/hal hal 0xffff8000c0000000 Hal.dll
          build_driver acpi drivers/acpi acpi 0xffff8000d0000000 acpi.sys
          build_driver pci drivers/pci pci 0xffff8000e0000000 pci.sys
          build_driver processor drivers/processor processor 0xffff8000f0000000 processor.sys
          RUSTFLAGS="-C debuginfo=2 -C force-frame-pointers=yes -C relocation-model=static -C link-arg=-T$GITHUB_WORKSPACE/drivers/storage/storahci.ld" cargo build --manifest-path drivers/storage/Cargo.toml --target x86_64-unknown-none --target-dir target/driver-storahci --release --bin storahci
          python3 tools/elf_to_pe32plus.py target/driver-storahci/x86_64-unknown-none/release/storahci build/drivers/storahci.sys --image-base 0xffff800110000000 --dll
          RUSTFLAGS="-C debuginfo=2 -C force-frame-pointers=yes -C relocation-model=static -C link-arg=-T$GITHUB_WORKSPACE/drivers/storage/stornvme.ld" cargo build --manifest-path drivers/storage/Cargo.toml --target x86_64-unknown-none --target-dir target/driver-stornvme --release --bin stornvme
          python3 tools/elf_to_pe32plus.py target/driver-stornvme/x86_64-unknown-none/release/stornvme build/drivers/stornvme.sys --image-base 0xffff800120000000 --dll
          RUSTFLAGS="-C debuginfo=2 -C force-frame-pointers=yes -C relocation-model=static -C link-arg=-T$GITHUB_WORKSPACE/drivers/storage/disk.ld" cargo build --manifest-path drivers/storage/Cargo.toml --target x86_64-unknown-none --target-dir target/driver-disk --release --bin disk
          python3 tools/elf_to_pe32plus.py target/driver-disk/x86_64-unknown-none/release/disk build/drivers/disk.sys --image-base 0xffff800130000000 --dll
          python3 - <<'PY'
          import struct
          from pathlib import Path
          for path in sorted(Path("build/drivers").iterdir()):
              p = path.read_bytes()
              assert p[:2] == b"MZ", f"{path}: missing MZ"
              pe = struct.unpack_from("<I", p, 0x3c)[0]
              assert p[pe:pe+4] == b"PE\0\0", f"{path}: missing PE"
              assert struct.unpack_from("<H", p, pe+4)[0] == 0x8664, f"{path}: wrong machine"
              assert struct.unpack_from("<H", p, pe+22)[0] & 0x2000, f"{path}: not a DLL image"
              opt = pe + 24
              assert struct.unpack_from("<H", p, opt)[0] == 0x20b, f"{path}: not PE32+"
              assert struct.unpack_from("<H", p, opt+68)[0] == 1, f"{path}: not native subsystem"
              assert struct.unpack_from("<I", p, opt+16)[0] != 0, f"{path}: no entry point"
              assert struct.unpack_from("<II", p, opt+112+8) == (0, 0), f"{path}: imports unsupported by stage-1 loader"
              assert struct.unpack_from("<II", p, opt+112+5*8) == (0, 0), f"{path}: relocations unsupported by stage-1 loader"
              print(f"validated native PE32+ driver: {path} ({len(p)} bytes)")
          PY
      - name: Test XSTATE source contracts
        run: python3 tools/xstate_source_contract_tests.py
      - name: Test user virtual-range validation
        run: |
          set -euo pipefail
          rustc --edition=2024 --test tools/vm_range_host_tests.rs -o /tmp/cognacos-vm-range-tests
          /tmp/cognacos-vm-range-tests
      - name: Run deterministic I/O rundown race and fault-injection tests
        run: |
          set -euo pipefail
          mkdir -p build
          rustc --edition=2021 --test tools/io_rundown_host_tests.rs -o build/io-rundown-host-tests
          build/io-rundown-host-tests --test-threads=1
      - name: Run host-side physical allocator map tests
        run: |
          mkdir -p build
          rustc --edition=2021 --test kernel/src/ntoskrnl/mm/physical.rs -o build/memory-tests
          build/memory-tests
      - name: Run host-side Ke timer-generation regression tests
        run: |
          mkdir -p build
          rustc --edition=2021 --test kernel/src/ntoskrnl/ke/timer_generation.rs -o build/ke-timer-generation-tests
          build/ke-timer-generation-tests
      - name: Test native NT RTL memory ABI primitives
        run: |
          set -euo pipefail
          mkdir -p build
          rustc --edition=2024 --test kernel/src/ntoskrnl/rtl_runtime/memory.rs -o build/rtl-memory-tests
          build/rtl-memory-tests
      - name: Run native Windows hive and NLS parser tests
        run: |
          set -euo pipefail
          mkdir -p build
          rustc --edition=2024 --test kernel/src/ntoskrnl/cm/hive.rs -o build/registry-hive-tests
          build/registry-hive-tests
          rustc --edition=2024 --test kernel/src/ntoskrnl/rtl_runtime/nls.rs -o build/nls-tests
          build/nls-tests
      - name: Run host-side registry runtime tests
        run: |
          set -euo pipefail
          mkdir -p build
          rustc --edition=2024 --test kernel/src/ntoskrnl/cm/runtime.rs -o build/registry-tests
          build/registry-tests
      - name: Run host-side Object Manager lifecycle and security tests
        run: |
          set -euo pipefail
          mkdir -p build
          rustc --edition=2024 --test kernel/src/ntoskrnl/ob/runtime.rs -o build/object-manager-tests
          build/object-manager-tests --test-threads=1
      - name: Run host-side Security Reference Monitor tests
        run: |
          set -euo pipefail
          mkdir -p build
          rustc --edition=2024 --test tools/security_runtime_host_tests.rs -o build/security-runtime-tests
          build/security-runtime-tests --test-threads=1
      - name: Run S4 hibernation codec and power-loss recovery tests
        run: |
          set -euo pipefail
          mkdir -p build
          rustc --edition=2024 --test kernel/src/ntoskrnl/po/hibernate.rs -o build/hibernation-tests
          build/hibernation-tests
      - name: Build freestanding Rust kernel with project linker script
        env:
          RUSTFLAGS: -C debuginfo=2 -C force-frame-pointers=yes -C relocation-model=static -C link-arg=-T${{ github.workspace }}/kernel/linker.ld
        run: cargo build --manifest-path kernel/Cargo.toml --target x86_64-unknown-none --release
      - name: Convert fixed-base kernel ELF to PE32+
        run: |
          python3 tools/elf_to_pe32plus.py target/x86_64-unknown-none/release/cognacos-kernel build/cognacos-kernel.exe --export-manifest kernel/src/ntoskrnl/manifest_26100.json
          file build/cognacos-kernel.exe
          python3 tools/validate_pe_exports.py build/cognacos-kernel.exe kernel/src/ntoskrnl/manifest_26100.json --require SeAccessCheck --require SePrivilegeCheck --require SeSinglePrivilegeCheck --require SeValidSecurityDescriptor --require SeCaptureSubjectContext --require SeReleaseSubjectContext --require SeLockSubjectContext --require SeUnlockSubjectContext --require PsAssignImpersonationToken --require PsReferencePrimaryToken --require PsDereferencePrimaryToken
          python3 - <<'PY'
          import struct
          p = open("build/cognacos-kernel.exe", "rb").read()
          assert p[:2] == b"MZ", "missing DOS MZ signature"
          off = struct.unpack_from("<I", p, 0x3c)[0]
          assert p[off:off+4] == b"PE\0\0", "missing PE signature"
          assert struct.unpack_from("<H", p, off+4)[0] == 0x8664, "not AMD64"
          assert struct.unpack_from("<H", p, off+24)[0] == 0x20b, "not PE32+"
          sections = struct.unpack_from("<H", p, off+6)[0]
          opt = off + 24
          assert struct.unpack_from("<Q", p, opt+24)[0] == 0xffffffff7fe00000, "unexpected kernel image base"
          assert struct.unpack_from("<H", p, opt+68)[0] == 1, "kernel must use native subsystem"
          assert struct.unpack_from("<II", p, opt+112+8) == (0, 0), "kernel imports are unsupported"
          assert struct.unpack_from("<II", p, opt+112+5*8) == (0, 0), "kernel relocations are unsupported"
          table = opt + struct.unpack_from("<H", p, off+20)[0]
          assert all(struct.unpack_from("<I", p, table+i*40+12)[0] >= 0x1000 for i in range(sections)), "invalid section RVA"
          print(f"PE32+ native kernel header validation passed: {sections} sections")
          PY
      - name: Pin PE32+ kernel digest into Rust bootloader trust anchor
        id: kernel-digest
        shell: bash
        run: |
          digest="$(sha256sum build/cognacos-kernel.exe | cut -d' ' -f1)"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
      - name: Sign PE32+ kernel and prepare verification key
        id: kernel-sign
        shell: bash
        env:
          COGNACOS_SIGNING_PRIVATE_KEY: ${{ secrets.COGNACOS_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p build
          if [[ -n "${COGNACOS_SIGNING_PRIVATE_KEY:-}" ]]; then
            printf '%s' "$COGNACOS_SIGNING_PRIVATE_KEY" > build/cognacos-kernel-signing.pem
            echo "Using repository-configured CognacOS signing key."
          else
            openssl genpkey -algorithm ED25519 -out build/cognacos-kernel-signing.pem
            echo "No release signing secret configured; using an ephemeral CI-only key."
          fi
          openssl pkey -in build/cognacos-kernel-signing.pem -pubout -outform DER -out build/cognacos-kernel-public.der
          openssl pkeyutl -sign -rawin -inkey build/cognacos-kernel-signing.pem -in build/cognacos-kernel.exe -out build/cognacos-kernel.sig
          public_key="$(tail -c 32 build/cognacos-kernel-public.der | xxd -p -c 64)"
          signature="$(xxd -p -c 128 build/cognacos-kernel.sig)"
          test "${#public_key}" -eq 64
          test "${#signature}" -eq 128
          openssl pkeyutl -verify -rawin -pubin -keyform DER -inkey build/cognacos-kernel-public.der -in build/cognacos-kernel.exe -sigfile build/cognacos-kernel.sig
          cp build/cognacos-kernel.exe build/cognacos-kernel-tampered.exe
          python3 - <<'PY'
          p = "build/cognacos-kernel-tampered.exe"
          with open(p, "r+b") as f:
              b = f.read(1)
              assert b
              f.seek(0)
              f.write(bytes([b[0] ^ 1]))
          PY
          if openssl pkeyutl -verify -rawin -pubin -keyform DER -inkey build/cognacos-kernel-public.der -in build/cognacos-kernel-tampered.exe -sigfile build/cognacos-kernel.sig >/dev/null 2>&1; then
            echo "Tampered kernel incorrectly passed signature verification." >&2
            exit 1
          fi
          rm -f build/cognacos-kernel-tampered.exe
          echo "Valid signature accepted and tampered kernel rejected."
          echo "public_key=$public_key" >> "$GITHUB_OUTPUT"
          echo "signature=$signature" >> "$GITHUB_OUTPUT"
          rm -f build/cognacos-kernel-signing.pem
      - name: Build Rust UEFI bootloader with pinned kernel trust anchors
        env:
          COGNACOS_KERNEL_SHA256: ${{ steps.kernel-digest.outputs.sha256 }}
          COGNACOS_KERNEL_SIGNATURE: ${{ steps.kernel-sign.outputs.signature }}
          COGNACOS_SIGNING_PUBLIC_KEY: ${{ steps.kernel-sign.outputs.public_key }}
          # Use the portable serial Curve25519 backend for the UEFI target; the
          # auto-selected SIMD backend crashes LLVM codegen on the hosted toolchain.
          RUSTFLAGS: '--cfg curve25519_dalek_backend="serial"'
          CARGO_PROFILE_RELEASE_OPT_LEVEL: 2
        run: cargo build --manifest-path bootloader/Cargo.toml --target x86_64-unknown-uefi --release
      - name: Optionally sign the UEFI bootloader for firmware Secure Boot
        shell: bash
        env:
          COGNACOS_SECURE_BOOT_CERT: ${{ secrets.COGNACOS_SECURE_BOOT_CERT }}
          COGNACOS_SECURE_BOOT_KEY: ${{ secrets.COGNACOS_SECURE_BOOT_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "${COGNACOS_SECURE_BOOT_CERT:-}" && -n "${COGNACOS_SECURE_BOOT_KEY:-}" ]]; then
            sudo apt-get update
            sudo apt-get install -y sbsigntool
            printf '%s' "$COGNACOS_SECURE_BOOT_CERT" > build/cognacos-secure-boot.crt
            printf '%s' "$COGNACOS_SECURE_BOOT_KEY" > build/cognacos-secure-boot.key
            sbsign --key build/cognacos-secure-boot.key --cert build/cognacos-secure-boot.crt --output build/cognacos-bootloader.signed.efi target/x86_64-unknown-uefi/release/cognacos-bootloader.efi
            sbverify --cert build/cognacos-secure-boot.crt build/cognacos-bootloader.signed.efi
            rm -f build/cognacos-secure-boot.key
            echo "UEFI bootloader signed with configured Secure Boot certificate."
          else
            echo "WARNING: no firmware Secure Boot signing certificate configured; bootloader is unsigned and Secure Boot firmware will reject it."
          fi
      - name: Validate source ELF and PE32+ kernel image
        run: |
          file target/x86_64-unknown-none/release/cognacos-kernel build/cognacos-kernel.exe
          readelf -h target/x86_64-unknown-none/release/cognacos-kernel | grep -qE 'Class:.*ELF64'
          readelf -h target/x86_64-unknown-none/release/cognacos-kernel | grep -qE 'Machine:.*X86-64'
          readelf -h target/x86_64-unknown-none/release/cognacos-kernel | grep -qE 'Type:.*EXEC'
          file build/cognacos-kernel.exe | grep -q 'PE32+'
      - name: Package a GPT EFI System Partition image
        run: |
          sudo apt-get update
          sudo apt-get install -y dosfstools mtools parted qemu-system-x86 ovmf swtpm llvm
          mkdir -p build/EFI/BOOT build/kernel
          if [[ -f build/cognacos-bootloader.signed.efi ]]; then
            cp build/cognacos-bootloader.signed.efi build/EFI/BOOT/BOOTX64.EFI
          else
            cp target/x86_64-unknown-uefi/release/cognacos-bootloader.efi build/EFI/BOOT/BOOTX64.EFI
          fi
          cp build/cognacos-kernel.exe build/EFI/BOOT/cognacos-kernel.exe
          cp build/cognacos-kernel.exe build/kernel/cognacos-kernel.exe
          cp target/x86_64-pc-windows-msvc/release/cognac_ntdll.dll build/EFI/BOOT/ntdll.dll
          truncate -s 256M build/cognacos-uefi.img
          truncate -s 128M build/pagefile.img
          parted -s build/cognacos-uefi.img mklabel gpt
          parted -s build/cognacos-uefi.img mkpart ESP fat32 1MiB 100%
          parted -s build/cognacos-uefi.img set 1 esp on
          mformat -i build/cognacos-uefi.img@@1048576 -F ::
          mmd -i build/cognacos-uefi.img@@1048576 ::/EFI
          mmd -i build/cognacos-uefi.img@@1048576 ::/EFI/BOOT
          mcopy -i build/cognacos-uefi.img@@1048576 build/EFI/BOOT/BOOTX64.EFI ::/EFI/BOOT/BOOTX64.EFI
          mcopy -i build/cognacos-uefi.img@@1048576 build/EFI/BOOT/cognacos-kernel.exe ::/EFI/BOOT/cognacos-kernel.exe
          mcopy -i build/cognacos-uefi.img@@1048576 build/EFI/BOOT/ntdll.dll ::/EFI/BOOT/ntdll.dll
      - name: Validate source-level QEMU crash resolver
        run: |
          set -euo pipefail
          python3 -m py_compile tools/resolve_qemu_trace.py
          python3 tools/resolve_qemu_trace.py --help >/dev/null
      - name: Boot smoke test under OVMF/QEMU
        shell: bash
        run: |
          set -euo pipefail
          # Select a matching CODE/VARS pair: mixing 2 MiB and 4 MiB
          # firmware images can make QEMU fail before the boot test starts.
          if [ -f /usr/share/OVMF/OVMF_CODE_4M.fd ] && [ -f /usr/share/OVMF/OVMF_VARS_4M.fd ]; then
            code=/usr/share/OVMF/OVMF_CODE_4M.fd
            vars_template=/usr/share/OVMF/OVMF_VARS_4M.fd
          elif [ -f /usr/share/OVMF/OVMF_CODE.fd ] && [ -f /usr/share/OVMF/OVMF_VARS.fd ]; then
            code=/usr/share/OVMF/OVMF_CODE.fd
            vars_template=/usr/share/OVMF/OVMF_VARS.fd
          else
            echo "No matching OVMF CODE/VARS firmware pair found" >&2
            find /usr/share/OVMF -maxdepth 1 -type f -print
            exit 1
          fi
          cp "$vars_template" build/OVMF_VARS.fd
          : > build/serial.log
          # Keep the original QEMU instance alive while GDB attaches. The old
          # timeout-based run killed QEMU before the diagnostic branch could run,
          # so its "GDB snapshot" silently started a second, unrelated boot.
          qemu-system-x86_64 \
            -machine pc -m 5G -cpu max -smp 4 \
            -drive if=pflash,format=raw,readonly=on,file="$code" \
            -drive if=pflash,format=raw,file=build/OVMF_VARS.fd \
            -drive if=ide,format=raw,file=build/cognacos-uefi.img \
            -drive if=ide,format=raw,index=1,file=build/pagefile.img \
            -boot order=c -display none -monitor none \
            -serial file:build/serial.log -gdb tcp::12345 \
            -d int,cpu_reset,guest_errors -D build/qemu-debug.log \
            -no-reboot -no-shutdown &
          qemu_pid=$!
          cleanup_qemu() {
            kill "$qemu_pid" 2>/dev/null || true
            wait "$qemu_pid" 2>/dev/null || true
          }
          trap cleanup_qemu EXIT

          # The NTDLL ABI smoke marker is emitted before the remaining PE,
          # process-exit, and scheduler tests. Do not stop QEMU at that intermediate
          # milestone: wait for process-lifecycle completion and a terminal timer result.
          # This leaves QEMU live at the actual failing instruction if later boot work hangs.
          for _ in $(seq 1 120); do
            if grep -Fq 'Ring-3 syscall dispatch, process exit, and PEB/TEB setup passed.' build/serial.log &&
               grep -Eq 'Timer preemption stress passed: non-yielding thread was preempted for a runnable peer\.|Timer preemption stress FAILED\.|WARNING: calibrated APIC timer could not start; interrupts remain disabled\.|Interrupts remain disabled because APIC/timer setup was not fully validated\.' build/serial.log; then
              break
            fi
            if ! kill -0 "$qemu_pid" 2>/dev/null; then
              echo "QEMU exited before ring-3 process-lifecycle and timer smoke tests completed." >&2
              cat build/serial.log || true
              exit 1
            fi
            sleep 0.25
          done

          if ! grep -Fq 'Ring-3 syscall dispatch, process exit, and PEB/TEB setup passed.' build/serial.log; then
            echo "Full ring-3 process-lifecycle smoke test did not complete; attaching GDB to the same live QEMU instance."
            command -v gdb >/dev/null || { sudo apt-get update && sudo apt-get install -y gdb; }
            set +e
            # Load DWARF-bearing ELF companions so GDB can resolve source file:line
            # for the kernel and HAL, while attaching to the *same* failing QEMU.
            # The native NTDLL PE/PDB and all debug companions are preserved as artifacts.
            cat > build/gdb-diagnose.gdb <<'GDB'
            set pagination off
            set confirm off
            set print pretty on
            set print frame-arguments all
            set disassemble-next-line on
            set backtrace limit 80
            set architecture i386:x86-64
            set substitute-path /home/runner/work/CognacOS/CognacOS .
            file target/x86_64-unknown-none/release/cognacos-kernel
            target remote 127.0.0.1:12345
            echo \\n===== LIVE CPU / SOURCE LOCATION =====\\n
            info registers
            info threads
            thread apply all info registers rip rsp
            thread apply all info line *$rip
            info line *$rip
            list *$rip
            info symbol $rip
            x/32i $rip-32
            x/32gx $rsp
            echo \\n===== KERNEL BACKTRACE WITH SOURCE LINES =====\\n
            thread apply all bt full
            echo \\n===== HAL SYMBOL COMPANION =====\\n
            add-symbol-file target/driver-hal/x86_64-unknown-none/release/hal
            info symbol $rip
            info line *$rip
            echo \\n===== NTDLL SYMBOL/EXPORT CHECK =====\\n
            info sharedlibrary
            maintenance info sections
            detach
            quit
          GDB
            set +e
            gdb -q -batch -x build/gdb-diagnose.gdb > build/gdb-state.txt 2>&1
            gdb_status=$?
            set -e
            echo "=== GDB live failure snapshot (status=$gdb_status) ==="
            cat build/gdb-state.txt || true
            echo "=== Serial log at GDB attach ==="
            cat build/serial.log || true
            echo "=== QEMU CPU exception / reset trace ==="
            tail -n 500 build/qemu-debug.log || true
            echo "=== Resolve native NTDLL RIP against its PDB/DWARF line tables ==="
            python3 - <<'PY'
          import re, struct, subprocess
          from pathlib import Path

          gdb = Path("build/gdb-state.txt").read_text(errors="replace")
          serial = Path("build/serial.log").read_text(errors="replace")
          m = re.search(r"\brip\s+0x([0-9a-fA-F]+)", gdb)
          if not m:
              print("GDB did not report RIP; retain gdb-state.txt and qemu-debug.log for manual analysis.")
              raise SystemExit(0)
          rip = int(m.group(1), 16)
          pe_path = Path("target/x86_64-pc-windows-msvc/release/cognac_ntdll.dll")
          if not pe_path.exists():
              print(f"NTDLL PE/PDB input missing: {pe_path}")
              raise SystemExit(0)
          blob = pe_path.read_bytes()
          if blob[:2] != b"MZ":
              print("NTDLL input is not a PE image.")
              raise SystemExit(0)
          pe = struct.unpack_from("<I", blob, 0x3c)[0]
          if blob[pe:pe+4] != b"PE\0\0":
              print("NTDLL PE signature is invalid.")
              raise SystemExit(0)
          opt = pe + 24
          image_base = struct.unpack_from("<Q", blob, opt + 24)[0]
          image_size = struct.unpack_from("<I", blob, opt + 56)[0]
          candidates = [int(x, 16) for x in re.findall(r"module=0x([0-9a-fA-F]+)", serial)]
          candidates.append(image_base)
          base = next((b for b in reversed(candidates) if b <= rip < b + image_size), None)
          if base is None:
              print(f"Current RIP 0x{rip:x} is outside known NTDLL image ranges; image preferred base=0x{image_base:x}.")
              print("Kernel/HAL source locations, full registers, and exception trace are above.")
              raise SystemExit(0)
          rva = rip - base
          print(f"NTDLL source resolution: RIP=0x{rip:x}, loaded_base=0x{base:x}, RVA=0x{rva:x}")
          cmd = ["llvm-symbolizer", "--obj=" + str(pe_path), "--relative-address", "--functions=linkage", "--demangle", hex(rva)]
          result = subprocess.run(cmd, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          print(result.stdout.rstrip() or "llvm-symbolizer returned no line information; inspect the archived PDB.")
          if result.returncode:
              print(f"llvm-symbolizer exit status: {result.returncode}")
          PY
            python3 tools/resolve_qemu_trace.py \
              --trace build/qemu-debug.log \
              --serial build/serial.log \
              --kernel target/x86_64-unknown-none/release/cognacos-kernel \
              --hal target/driver-hal/x86_64-unknown-none/release/hal \
              --ntdll target/x86_64-pc-windows-msvc/release/cognac_ntdll.dll \
              --gdb build/gdb-state.txt || true
            exit 1
          fi

          cleanup_qemu
          trap - EXIT
          cat build/serial.log
          grep -F 'Timer preemption stress passed: non-yielding thread was preempted for a runnable peer.' build/serial.log
          grep -F 'CognacOS Rust kernel entered.' build/serial.log
          grep -F 'XSTATE processor policy initialized; enabled mask=' build/serial.log
          grep -F 'XSTATE XSAVE/XRSTOR processor self-test passed.' build/serial.log
          grep -F 'KUSER_SHARED_DATA XState mapping and read-only ABI test passed.' build/serial.log
          grep -F 'Bootloader verified kernel SHA-256 and Ed25519 code signature.' build/serial.log
          grep -F 'Kernel-owned CR3 activated successfully.' build/serial.log
          grep -F 'No TPM 2.0 measured-boot device; optional feature skipped.' build/serial.log
          grep -F 'Page-table inspection passed: high-half kernel sections, stack alias, low boot data, and guard pages validated.' build/serial.log
          grep -F 'High-RAM allocator and direct-map self-test passed.' build/serial.log
          grep -F 'NT memory manager: physical translation, validity, and checked-copy self-test passed.' build/serial.log
          grep -F 'Physical allocator initialized' build/serial.log
          grep -F 'Pagefile storage initialized on dedicated ATA primary-slave disk; slots:' build/serial.log
          grep -F 'Pagefile storage read/write self-test passed.' build/serial.log
          grep -F 'Pagefile-backed pageable eviction and fault-driven page-in self-test passed.' build/serial.log
          grep -F 'HAL CPU-local registry, MMIO bounds, and x86-64 primitives initialized.' build/serial.log
          grep -F 'SMP startup target validation passed.' build/serial.log
          grep -E 'SMP AP startup complete; online application processors: [1-9][0-9]*' build/serial.log
          grep -F 'Firmware ACPI MADT validated; enabled APs discovered:' build/serial.log
          grep -F 'I/O manager cancellation, in-flight ownership, and asynchronous completion tests passed.' build/serial.log
          grep -F 'WDM exactly-once completion and outstanding-IRP unload rundown self-test passed.' build/serial.log
          grep -F 'Security: CR0.WP enabled' build/serial.log
          grep -F 'Security: NX enabled; strict page policy follows' build/serial.log
          grep -F 'Security: 4 KiB page policy active; W^X enforced for kernel sections.' build/serial.log
          grep -F 'Security: kernel stack guard page unmapped.' build/serial.log
          grep -F 'Protection self-tests passed: read-only write trapped and NX execution trapped.' build/serial.log
          grep -F 'Process address-space and checked user-copy self-test passed.' build/serial.log
          grep -F 'Native NT syscall dispatcher QEMU self-test passed: five args, invalid buffers, unsupported IDs, and 17-arg stack copy.' build/serial.log
          grep -F 'NTDLL PE32+ image mapped and exports registered.' build/serial.log
          grep -F 'Per-process page-table isolation, same-VA non-aliasing, and supervisor mapping protection passed.' build/serial.log
          grep -F 'Security: ring-3 GDT/TSS RSP0 installed; IRETQ transition available.' build/serial.log
          grep -F 'PE32+ loader self-test passed; image base=0x0000200000000000 entry=0x0000200000001000 (RX section and RO/NX headers).' build/serial.log
          grep -F 'PE fixture: DLL export registration passed.' build/serial.log
          grep -F 'PE fixture: normal import binding passed.' build/serial.log
          grep -F 'PE fixture: delay import binding passed.' build/serial.log
          grep -F 'Windows API-set resolution and PE TLS/unwind registration passed.' build/serial.log
          grep -F 'PE TLS callbacks executed in ring 3; per-image TLS blocks initialized.' build/serial.log
          grep -F 'Ext filesystem parser self-test passed (read-only ext2/ext3/ext4 metadata; unsupported features rejected).' build/serial.log
          grep -F 'Ring-3 syscall dispatch, process exit, and PEB/TEB setup passed.' build/serial.log
          grep -F 'CognacOS Rust NTDLL passed ring-3 tests through the unified Windows x64 SYSCALL ABI.' build/serial.log
      - name: SMP boot and interrupt stress matrix (2, 4, 8 vCPUs)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /usr/share/OVMF/OVMF_CODE_4M.fd ] && [ -f /usr/share/OVMF/OVMF_VARS_4M.fd ]; then
            code=/usr/share/OVMF/OVMF_CODE_4M.fd
            vars_template=/usr/share/OVMF/OVMF_VARS_4M.fd
          else
            code=/usr/share/OVMF/OVMF_CODE.fd
            vars_template=/usr/share/OVMF/OVMF_VARS.fd
          fi
          for cpus in 2 4 8; do
            echo "=== SMP stress boot: $cpus vCPUs ==="
            cp "$vars_template" "build/OVMF_VARS_smp_$cpus.fd"
            log="build/serial-smp-$cpus.log"
            rm -f "$log"
            set +e
            timeout 22s qemu-system-x86_64 \
              -machine pc -m 5G -cpu qemu64 -smp "$cpus" \
              -drive if=pflash,format=raw,readonly=on,file="$code" \
              -drive if=pflash,format=raw,file="build/OVMF_VARS_smp_$cpus.fd" \
              -drive if=ide,format=raw,file=build/cognacos-uefi.img \
              -drive if=ide,format=raw,index=1,file=build/pagefile.img \
              -boot order=c -display none -monitor none \
              -serial "file:$log" -no-reboot -no-shutdown
            status=$?
            set -e
            if [ "$status" -ne 124 ] && [ "$status" -ne 0 ]; then
              echo "QEMU SMP stress boot failed (vCPUs=$cpus, status=$status)" >&2
              cat "$log" || true
              exit "$status"
            fi
            cat "$log"
            expected_aps=$((cpus - 1))
            grep -F "SMP AP startup complete; online application processors: $expected_aps; interrupt-driven TLB shootdowns enabled." "$log"
            grep -F "Per-CPU TSS/IST setup self-test passed." "$log"
            grep -F "Per-CPU interrupt setup stress passed: 64 acknowledged IPIs per online AP." "$log"
            grep -F "SMP scheduler, cross-CPU wakeup, contended-lock, IRP/object teardown stress passed." "$log"
            grep -F "Kernel VM extent stress and SMP TLB shootdown self-test passed." "$log"
          done
      - name: Upload Rust artifacts and boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cognacos-rust-uefi-kernel
          path: |
            build/EFI/BOOT/BOOTX64.EFI
            build/EFI/BOOT/ntdll.dll
            build/kernel/cognacos-kernel.exe
            build/cognacos-uefi.img
            build/serial.log
            build/serial-smp-*.log
            build/gdb-state.txt
            build/gdb-diagnose.gdb
            build/qemu-debug.log
            build/ntdll/cognac_ntdll.pdb
            target/x86_64-unknown-none/release/cognacos-kernel
            target/driver-hal/x86_64-unknown-none/release/hal
            target/driver-acpi/x86_64-unknown-none/release/acpi
            target/driver-pci/x86_64-unknown-none/release/pci
            target/driver-processor/x86_64-unknown-none/release/processor
            target/driver-storahci/x86_64-unknown-none/release/storahci
            target/driver-stornvme/x86_64-unknown-none/release/stornvme
            target/driver-disk/x86_64-unknown-none/release/disk
            build/drivers/Hal.dll
            build/drivers/acpi.sys
            build/drivers/pci.sys
            build/drivers/processor.sys
            build/drivers/storahci.sys
            build/drivers/stornvme.sys
            build/drivers/disk.sys
