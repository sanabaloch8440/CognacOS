name: AML definition-block parser tests

on:
  pull_request:
    paths:
      - 'drivers/acpi/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/aml-parser.yml'
  push:
    branches: [main]
    paths:
      - 'drivers/acpi/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/aml-parser.yml'

permissions:
  contents: read

concurrency:
  group: cognacos-aml-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aml-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustup target add x86_64-unknown-linux-gnu
          bash scripts/build.sh toolchain
      - name: Test AML definition-block parser and namespace loader
        run: cargo test --manifest-path drivers/acpi/Cargo.toml --target x86_64-unknown-linux-gnu --lib aml::
      - name: Check ACPI library
        run: cargo check --manifest-path drivers/acpi/Cargo.toml --target x86_64-unknown-linux-gnu --lib
