name: Rust NTDLL
on:
  push:
    paths:
      - "ntdll/**"
      - ".github/workflows/ntdll-rust.yml"
  pull_request:
    paths:
      - "ntdll/**"
      - ".github/workflows/ntdll-rust.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Validate native NTDLL export table
        run: python3 ntdll/tools/check_export_table.py
      - name: Compile and type-check all Rust NTDLL modules
        run: cargo check --manifest-path ntdll/Cargo.toml --all-targets --target x86_64-unknown-linux-gnu
