name: Build x64 DLL stubs

on:
  push:
    branches: [main]
    paths:
      - 'dlls/kernel32/**'
      - 'dlls/shell32/**'
      - '.github/workflows/build-dll-stubs.yml'
  pull_request:
    paths:
      - 'dlls/kernel32/**'
      - 'dlls/shell32/**'
      - '.github/workflows/build-dll-stubs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang and LLD
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
      - name: Build kernel32.dll and shell32.dll
        shell: bash
        run: |
          set -euo pipefail
          for dll in kernel32 shell32; do
            chmod +x "dlls/$dll/build.sh"
            "dlls/$dll/build.sh"
            file "dlls/$dll/build/$dll.dll"
            llvm-readobj --file-headers --coff-exports "dlls/$dll/build/$dll.dll"
          done
      - name: Verify expected exports and PE32+ machine type
        shell: bash
        run: |
          set -euo pipefail
          for dll in kernel32 shell32; do
            llvm-readobj --file-headers --coff-exports "dlls/$dll/build/$dll.dll" > "dlls/$dll/build/exports.txt"
            grep -q 'IMAGE_FILE_MACHINE_AMD64' "dlls/$dll/build/exports.txt"
            while IFS= read -r symbol; do
              [[ -z "$symbol" || "$symbol" == \#* ]] && continue
              grep -Fq "$symbol" "dlls/$dll/build/exports.txt" || { echo "Missing export: $dll!$symbol" >&2; exit 1; }
            done < "dlls/$dll/exports/windows-11-x64-exports.txt"
          done
      - name: Upload DLLs and export reports
        uses: actions/upload-artifact@v4
        with:
          name: cognacos-x64-dll-stubs
          path: |
            dlls/kernel32/build/kernel32.dll
            dlls/kernel32/build/exports.txt
            dlls/shell32/build/shell32.dll
            dlls/shell32/build/exports.txt
          if-no-files-found: error
