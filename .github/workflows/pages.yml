name: Deploy CognacOS Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.md'
      - '_config.yml'
      - 'assets/**'
      - 'docs/**'
      - 'roadmap.md'
      - 'WINDOWS11_COGNACOS_NTOSKRNL_*_COMPARISON.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Install Jekyll
        run: gem install jekyll minima jekyll-relative-links
      - name: Build site
        run: jekyll build --baseurl "/CognacOS" --destination "_site"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
