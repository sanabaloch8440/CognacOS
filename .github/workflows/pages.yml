name: Publish documentation to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "_config.yml"
      - "roadmap.md"
      - "WINDOWS11_RDOTOS_NTOSKRNL_KE_COMPARISON.md"
      - "WINDOWS11_RDOTOS_NTOSKRNL_SE_COMPARISON.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Sync canonical compatibility inventories into the site
        shell: bash
        run: |
          set -euo pipefail
          cp WINDOWS11_RDOTOS_NTOSKRNL_KE_COMPARISON.md docs/compatibility/ke.md
          cp WINDOWS11_RDOTOS_NTOSKRNL_SE_COMPARISON.md docs/compatibility/se.md
          sed -i 's](WINDOWS11_RDOTOS_NTOSKRNL_SE_COMPARISON.md)](se.md)]g; s](WINDOWS11_RDOTOS_NTOSKRNL_KE_COMPARISON.md)](ke.md)]g; s](roadmap.md)](../roadmap.md)]g' docs/compatibility/ke.md docs/compatibility/se.md
      - uses: actions/jekyll-build-pages@v1
        with:
          source: .
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
