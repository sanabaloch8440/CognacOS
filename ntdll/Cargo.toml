[package]
name = "cognac-ntdll"
version = "0.1.0"
edition = "2021"
publish = false

build = "build.rs"

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
libm = { version = "0.2", default-features = false }
cognacos-nt-abi = { path = "../shared/nt-abi" }

[features]
default = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
