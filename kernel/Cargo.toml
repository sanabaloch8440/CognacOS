[package]
name = "cognacos-kernel"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"

[features]
default = []
# Enable detailed page-table walk failure records in CI/QEMU diagnostics.
diagnostic-vm = []

[dependencies]
cognacos-nt-abi = { path = "../shared/nt-abi" }
cognacos-acpi = { path = "../drivers/acpi" }
cognacos-pci = { path = "../drivers/pci" }
cognacos-hal-contract = { path = "../drivers/hal" }
cognacos-ext4 = { path = "../drivers/ext4" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "s"
