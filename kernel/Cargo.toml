[package]
name = "rdotos-kernel"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"

[dependencies]
rdotos-acpi = { path = "../drivers/acpi" }
rdotos-pci = { path = "../drivers/pci" }
rdotos-hal-contract = { path = "../drivers/hal" }
rdotos-ext4 = { path = "../drivers/ext4" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "s"
