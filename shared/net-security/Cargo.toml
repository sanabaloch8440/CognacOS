[package]
name = "cognacos-net-security"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
socket2 = { version = "0.5", features = ["all"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "aws_lc_rs"] }
webpki-roots = "0.26"
x509-parser = "0.16"
hyper = { version = "1", default-features = false, features = ["client", "http1", "http2"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[features]
default = ["tls-client"]
tls-client = []
