[package]
name = "cognacos-syssetup"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
build = "build.rs"
[lib]
name = "syssetup"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]
[profile.dev]
panic = "abort"
[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "s"
