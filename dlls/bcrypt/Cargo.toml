[package]
name = "cognacos-bcrypt"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[lib]
name = "bcrypt"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
hmac = "0.12"
pbkdf2 = "0.12"
aes = "0.8"
aes-gcm = "0.10"
cipher = "0.4"
zeroize = "1"
rsa = { version = "0.9", features = ["sha2"] }
rand = { version = "0.8", features = ["std", "std_rng"] }
sha2 = { version = "0.10", features = ["oid"] }
p256 = { version = "0.13", features = ["ecdh"] }
ml-kem = { version = "0.3.3", features = ["getrandom", "zeroize"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "s"
