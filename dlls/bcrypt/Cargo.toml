[package]
name = "cognacos-bcrypt"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[lib]
name = "bcrypt"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
aws-lc-rs = "1"
aes = "0.8"
cipher = "0.4"
padding = "0.2"
zeroize = "1"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "s"
